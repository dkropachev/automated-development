schema_version: "1.1"
name: draft-on-create-issue
description: >
  The same repo and cached prompt as draft-issue-from-cached-prompt, asked for the action rather
  than for the text, and without naming the kind: "create an issue". The skill is drafts-only, which
  is a limit on what it does and not on when it runs, so the title, labels and body still have to
  come from the cached prompt, and the bug kind still has to be picked from the failure described.
  Drafting the text and then stopping without trying to file the issue at all is a failure too. gh
  is unauthenticated here, so the issue cannot actually be filed and the run has to say so.
  `gh issue create` is the one writing call this case allows -- it is what was asked for -- so the
  write guard lists the others.
tags: [draft-issue-description, offline]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
