schema_version: "1.1"
name: draft-commit-from-cached-prompt
description: >
  A repo with a fresh cached commit-message prompt and one staged, uncommitted change. The skill
  must draft from the cache in that repo's grammar, run the driver with --domain commit, never run
  git commit or git push, and print the message as one fenced block. gh is unauthenticated here and
  is not needed: the commit skill runs on git alone.
tags: [draft-commit-message, offline]
runs: 2
context:
  scaffold_script: scaffold.sh
execution:
  max_turns: 40
  timeout_seconds: 900
  allowed_tools: [Bash, Read, Write, Edit, Glob, Grep, Skill]
