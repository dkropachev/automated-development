stripped.","selfRejected":false},{"file":"tests/unit/rpc_test.cc","line":1883,"title":"put(std::span\u003ctemporary_buffer\u003cchar>>) override breaks builds at --api-level=7|8","severity":"low","kind":"bug","claim":"The put(std::span\u003ctemporary_buffer\u003cchar>>) override only exists at SEASTAR_API_LEVEL >= 9 (guarded by an #if in loopback_socket.hh:144), which breaks --api-level=7|8 even though CMakeLists.txt:72 still accepts those levels.","selfRejected":false},{"file":"tests/unit/rpc_test.cc","line":2016,"title":"Test never asserts the send was refused; success case is silently swallowed","severity":"low","kind":"test-gap","claim":"The test never asserts the send was refused; catch (closed_error&) {} swallows the success case too, so a regression that accepted-and-dropped the frame would still pass. The throw should be asserted.","selfRejected":false},{"file":"include/seastar/rpc/rpc_types.hh","line":318,"title":"Commit documents sink/source but omits send_empty_frame","severity":"low","kind":"docs","claim":"Commit 3 documents sink and source but not send_empty_frame, the one API whose failure mode this PR widens.","selfRejected":false},{"file":"src/rpc/rpc.cc","line":550,"title":"Re-entry into stream_close() guarded only by error(), not by _stream_closing","severity":"low","kind":"bug","claim":"Re-entry into stream_close() is guarded only by error(), which is false for the whole new await; reachability is low (needs source::make_sink() re-open) and the issue is pre-existing, but adding !error() && !_stream_closing is free.","selfRejected":false},{"file":"src/rpc/rpc.cc","line":562,"title":"Drain wait is unbounded and its comment doesn't name what breaks it","severity":"low","kind":"docs","claim":"The drain wait is unbounded; the comment would be more useful naming what breaks it (stop_send_loop's shutdown_output) rather than only who no longer waits. Not a regression.","selfRejected":false},{"file":"src/rpc/rpc.cc","line":565,"title":"Inner lambda parameter f shadows outer auto f","severity":"nit","kind":"style","claim":"The inner lambda param f shadows the auto f from line 549, in the statement assigning the outer one.","selfRejected":false},{"file":"doc/rpc-streaming.md","line":106,"title":"Doc overstates that both halves of a stream must always be closed","severity":"low","kind":"docs","claim":"\"Both halves of a stream must be closed\" overstates it; with no returned sink, _source_closed is true from construction (rpc.hh:301), so the doc should say \"each half you were given\".","selfRejected":false},{"file":"tests/unit/rpc_test.cc","line":1895,"title":"buffer_size() hardcodes 8192","severity":"nit","kind":"style","claim":"buffer_size() hardcodes the value 8192.","selfRejected":false},{"file":"tests/unit/rpc_test.cc","line":1946,"title":"Ternary data.size ? ... : snd_buf(...) is a no-op copied from a neighbour","severity":"nit","kind":"style","claim":"The data.size ? … : snd_buf(...) ternary is a no-op that appears to have been copied from a neighbouring test.","selfRejected":false},{"file":"tests/unit/rpc_test.cc","line":2022,"title":"for (i \u003c 10) yield() loop uses an unexplained magic constant","severity":"nit","kind":"style","claim":"The for (i \u003c 10) yield() loop uses a magic constant of 10.","selfRejected":false},{"file":"","line":0,"title":"New comments use two spaces after a full stop, inconsistent with rest of file","severity":"nit","kind":"style","claim":"New comments use two spaces after a full stop; both files use one space everywhere else.","selfRejected":false},{"file":"src/rpc/rpc.cc","line":0,"title":"stream_close() could previously close output_stream while a queued send_entry() was mid-write/flush","severity":"medium","kind":"bug","claim":"The drain wait added by this PR incidentally removes a second, previously unclaimed bug: stream_close() could close the output_stream while a queued send_entry() was mid-write()/flush() on it.","selfRejected":false}],"extractError":null,"issueIds":["I2","I3","I4","I6","I9","I10","I13","I23","I24","I27","I29","I30","I36","I42","I52"],"metrics":{"claims":15,"judged":15,"real":14,"falsePositive":1,"unproven":0,"inScope":14,"prIntroduced":14,"uniqueReal":3,"severityHigh":1,"severityMediumPlus":5,"severityLowPlus":9,"precision":0.9333333333333333,"falsePositiveRate":0.06666666666666667,"realPerDollar":3.186981091185903,"minutesPerReal":1.0131999999999999,"costPerReal":0.3137765714285714},"report":"Review complete (read-only; nothing edited or posted).\n\n**Verdict: merge with fixes.** The production change in `src/rpc/rpc.cc` / `include/seastar/rpc/rpc.hh` is correct and minimal — `write_buf.close()` has exactly two callers, `stop_send_loop` already sets `_error` first, and `stream_close` was the one unguarded one. The reasoning for not setting `_error` checks out (`abort()` is a no-op once `_error` is set, so `stop()` would never `shutdown_input()`). The drain wait also removes a second, unclaimed bug: `stream_close()` could previously close the `output_stream` while a queued `send_entry()` was mid-`write()`/`flush()` on it. `_stream_closing` and `stop_send_loop` cannot interleave — neither prologue has a suspension point. Blockers are all in the test and commit metadata.\n\n**Important**\n\n1. `tests/unit/rpc_test.cc:1957` — server compressor factory mutated cross-shard. `server_factory` lives on shard 0 but `loopback_socket_impl::connect` (`tests/unit/loopback_socket.hh:343`) round-robins server connections, so at the default `--smp 2` the stream connection's `negotiate()` runs `const_cast\u003c...>(this)->hooks.push_back(...)` on shard 1 against a shard-0 vector — unsynchronized mutation, buffer allocated by shard 1's allocator and freed by shard 0. UB; ASan/UBSan don't catch it, so \"passes on 2 shards\" doesn't clear it. The server only needs to advertise `COMPRESS`; give it a non-recording factory.\n2. `tests/unit/rpc_test.cc:2000` — `hooks.size() == 2` + `hooks.back()` hardcodes loopback's shard/ordering policy, and `auto&` into a growing `std::vector` is invalidated by any later negotiation. Capture the stream hook explicitly, or at least by value.\n3. All three commits carry `Co-Authored-By: Claude …` trailers (verified: 4 lines across `f545c28a`, `5e25ebdb`, `69da8f5b`). The PR body also has the \"🤖 Generated with Claude Code\" line. Strip both.\n\n**Minor**\n\n4. `tests/unit/rpc_test.cc:1883` — the `put(std::span\u003ctemporary_buffer\u003cchar>>)` override only exists at `SEASTAR_API_LEVEL >= 9`; `loopback_socket.hh:144` `#if`s exactly this. Breaks `--api-level=7|8`, still accepted by `CMakeLists.txt:72`.\n5. `tests/unit/rpc_test.cc:2016` — the test never asserts the send was refused; the `catch (closed_error&) {}` swallows the success case, so a regression that accepted-and-dropped the frame would still pass. Assert the throw.\n6. `include/seastar/rpc/rpc_types.hh:318` — commit 3 documents `sink` and `source` but not `send_empty_frame`, the one API whose failure mode this PR widens.\n7. `src/rpc/rpc.cc:550` — re-entry into `stream_close()` is guarded only by `error()`, false for the whole new await. Low reachability (needs `source::make_sink()` re-open), pre-existing, but `!error() && !_stream_closing` is free.\n8. `src/rpc/rpc.cc:562` — drain wait is unbounded; the comment would be more useful naming what breaks it (`stop_send_loop`'s `shutdown_output`) rather than only who no longer waits. Not a regression.\n9. `src/rpc/rpc.cc:565` — inner lambda param `f` shadows the `auto f` from line 549, in the statement assigning the outer one.\n10. `doc/rpc-streaming.md:106` — \"Both halves of a stream must be closed\" overstates it; with no returned sink, `_source_closed` is `true` from construction (`rpc.hh:301`). Say \"each half you were given\".\n11. Test nits: `buffer_size()` hardcodes 8192 (`:1895`); the `data.size ? … : snd_buf(...)` ternary at `:1946` is a no-op copied from a neighbour; the `for (i \u003c 10) yield()` at `:2022` is a magic constant.\n12. New comments use two spaces after a full stop; both files use one everywhere else.\n\nNothing Critical — no hang, leak, double-close, or lifetime bug was constructible in the production change.","prompt":"Use the `requesting-code-review` skill to have this pull request reviewed.\n\nYou are reviewing pull request #1 of this repository (dkropachev/ironweave) - a C++ project. The PR branch `rpc-stream-close-send-window` is checked out and its base branch is `main`, so the change under review is exactly `git diff main...HEAD`. Read the PR's own title and description first with `gh pr view 1`. Report EVERY finding you are confident in, each with: the file and line, a one-line title, a severity, and the reason it is wrong. This is a read-only review: do not edit, commit, push, or comment on the PR. If you start a background workflow, do NOT write your final message until its result has arrived: a turn that ends while the workflow is still running kills it and loses the whole review. While you wait, keep making small tool calls (`git log -1`, `ls`) - the workflow's result is delivered to you between tool calls - and only then report its findings inline.","promptSource":"recorded","stderr":"","metadata":{"target":"ironweave","language":"C++","fork":"dkropachev/ironweave","pr":1,"tool":"superpowers-review","label":"Superpowers requesting-code-review","source":"superpowers@superpowers-dev","exitCode":0,"signal":null,"wallMs":851088,"reportedCostUsd":4.392872,"reportedUsage":{"input_tokens":10,"cache_creation_input_tokens":37268,"cache_read_input_tokens":164595,"output_tokens":5628,"output_tokens_details":{"thinking_tokens":337},"server_tool_use":{"web_search_requests":0,"web_fetch_requests":0},"service_tier":"standard","cache_creation":{"ephemeral_1h_input_tokens":37268,"ephemeral_5m_input_tokens":0},"inference_geo":"not_available","iterations":[{"input_tokens":2,"output_tokens":1530,"cache_read_input_tokens":47494,"cache_creation_input_tokens":362,"cache_creation":{"ephemeral_5m_input 740057,"finishedAt":"2026-09-21T01:58:58.911Z","exitCode":0,"signal":null,"isError":false,"apiErrorStatus":null,"salvaged":false,"wallMsDerived":false,"attempts":null,"dnfReason":null,"usage":{"input":132,"output":105848,"thinking":84453,"cacheRead":5071433,"cacheCreation":225294,"costUsd":7.4355165,"sessions":2,"total":5402707,"models":{"claude-opus-5[1m]":7.4355165},"rawMessages":123,"subagentTranscripts":0,"sources":{"input":"transcript","output":"transcript","thinking":"transcript","cacheRead":"transcript","cacheCreation":"transcript","costUsd":"transcript","sessions":"transcript","total":"transcript"},"source":"transcript"},"numTurns":43,"sessionId":"992858bd-7f72-4f11-9dd2-171c2a17c917","subagentStats":{"spawned":0,"requested":{"background":0,"foreground":0,"unset":0},"started_in_background":0,"max_depth":0,"spawned_by_subagents":0,"completed":0,"failed":0,"killed":{"parent":0,"user":0,"system":0},"refused":{"depth_limit":0,"concurrency_limit":0,"budget":0},"by_type":{}},"claims":[{"file":"tests/unit/rpc_test.cc","line":1883,"title":"Unguarded put(std::span\u003ctemporary_buffer\u003cchar>>) override breaks build at SEASTAR_API_LEVEL 7/8","severity":"medium","kind":"bug","claim":"The override is unguarded but that member only exists under SEASTAR_API_LEVEL >= 9; below 9 the pure virtual is put(net::packet), so this causes an override-of-nothing error and leaves the class abstract, while CMakeLists.txt still lists 7 and 8 as valid levels."},{"file":"tests/unit/rpc_test.cc","line":2004,"title":"Queue-drain half of the fix is untested","severity":"medium","kind":"test-gap","claim":"_outgoing_queue is empty when the test reaches stream_close() because sink_impl::close() awaits the eof-marker send() before calling close_sink(), so queue_drained is already resolved and the drain is a no-op; reverting the std::exchange/then_wrapped hunk while keeping _stream_closing still leaves the new test green."},{"file":"tests/unit/rpc_test.cc","line":2016,"title":"Test never as l":1.7620404761904762,"costPerReal":1.062216642857143},"report":"The core fix is sound — I verified the ordering claims in the PR description rather than taking them on trust (details in the report's non-findings section). Seven findings, none critical.\n\n**Report:** `/tmp/diffrev/DIFFERENTIAL_REVIEW_REPORT.md` (written outside the repo to keep the tree untouched). No build run — there's no `build/` directory in this worktree.\n\n### Findings\n\n**1. [Medium] Breaks the build at `Seastar_API_LEVEL` 7/8** — `tests/unit/rpc_test.cc:1883`\n`put(std::span\u003ctemporary_buffer\u003cchar>>) override` is unguarded. That member only exists under `#if SEASTAR_API_LEVEL >= 9` (`include/seastar/core/iostream.hh:110-127`); below 9 the pure virtual is `put(net::packet)`. Two errors follow: `override` overriding nothing, and the class staying abstract. `CMakeLists.txt:72-76` still lists 7 and 8 as valid, and the repo's own equivalent helper guards it (`tests/unit/loopback_socket.hh:142-153`).\n\n**2. [Medium] The queue-drain half of the fix is untested** — `tests/unit/rpc_test.cc:2004`, covering `src/rpc/rpc.cc:562-570`\n`_outgoing_queue` is empty when the test reaches `stream_close()` — `sink_impl::close()` awaits the eof-marker `send()` before calling `close_sink()` (`rpc_impl.hh:917-925`) — so `queue_drained` is already resolved and the drain is a no-op. Reverting the `std::exchange`/`then_wrapped` hunk while keeping `_stream_closing` leaves the new test green. The case it exists for is a frame accepted in the continuation hop before `close_sink()` runs, i.e. exactly the \"frames accepted just before the mark\" the description cites.\n\n**3. [Low] Test never asserts `send()` is refused** — `tests/unit/rpc_test.cc:2016`\nThe `try`/`catch (const rpc::closed_error&)` passes whether or not the frame is rejected; only the downstream `put_after_close` symptom is checked. `BOOST_REQUIRE_THROW`, or a `BOOST_FAIL` after the `.get()`.\n\n**4. [Low] Comment contradicts the code** — `sr <script>
'use strict';

(() => {
  const DATA = JSON.parse(document.getElementById('dashboard-data').textContent)
  const app = document.getElementById('app')
  const issues = new Map(DATA.issues.map((issue) => [`${issue.targetId}/${issue.id}`, issue]))
  for (const run of DATA.runs) run.issues = run.issueIds.map((id) => issues.get(`${run.targetId}/${id}`)).filter(Boolean)

  const svgNs = 'http://www.w3.org/2000/svg'
  let activeView = 'home'

  const el = (tag, attrs = {}, ...children) => {
    const node = document.createElement(tag)
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value == null) continue
      if (key === 'class') node.className = value
      else if (key === 'checked') node.checked = Boolean(value)
      else if (key === 'disabled') node.disabled = Boolean(value)
      else if (key.startsWith('on') && typeof value === 'function') node.addEventListener(key.slice(2), value)
      else node.setAttribute(key, String(value))
    }
    for (const child of children.flat()) {
      if (child == null) continue
      node.append(child instanceof Node ? child : document.createTextNode(String(child)))
    }
    return node
  }

  const svg = (tag, attrs = {}, ...children) => {
    const node = document.createElementNS(svgNs, tag)
    for (const [key, value] of Object.entries(attrs)) if (value != null) node.setAttribute(key, String(value))
    for (const child of children.flat()) if (child != null) node.append(child)
    return node
  }

  const number = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 })
  const compact = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 })
  const fmt = (value, kind = 'number') => {
    if (value == null || !Number.isFinite(value)) return 'N/A'
    if (kind === 'money') return '$' + value.toFixed(value < 10 ? 2 : 1)
    if (kind === 'percent') return (value * 100).toFixed(1) + '%'
    if (kind === 'minutes') return number.format(value / 60000) + ' min'
    if (kind === 'compact') return compact.format(value)
    if (kind === 'ratio') return value.toFixed(2) + '×'
    return number.format(value)
  }

  const metricHints = {

    'Cache create': 'Tokens written to the prompt cache.',

    'Candidate': 'The skill, model stack, or language currently being ranked.',
    'Cache read': 'Previously cached prompt tokens reused by the model.',
    'Claims': 'Raw findings extracted from a run before duplicate merging and verification.',
    'Completeness': 'Distinct real issues found divided by all real issues found by eligible complete or salvaged runs.',
    'Completeness / dollar': 'Completeness percentage points divided by total recorded cost for every attempted run.',

    'Δ': 'Right value minus left value.',
    'Distinct real': 'Verified real issues in the cohort, counted once per target.',
    'Extracted claims': 'Raw findings extracted from a run before duplicate merging and verification.',
    'False positives': 'Judged issues determined not to be real problems.',

    'Findings / dollar': 'Distinct verified real issues found per U.S. dollar of recorded cost.',

    'Ratio': 'Right value divided by left value.',
    'Real': 'Distinct judged issues attributed to the run and verified as real problems.',
    'Real / $': 'Verified real issues found per U.S. dollar of recorded cost.',
    'Real / dollar': 'Verified real issues found per U.S. dollar of recorded cost.',
    'Real / run': 'Distinct verified real issues divided by complete or salvaged runs.',
    'Real findings': 'Distinct judged issues attributed to the run and verified as real problems.',
    'Recorded cost (USD)': 'Recorded API usage cost in U.S. dollars.',
    'Shared': 'Verified real issues also found by at least one other selected skill.',
    'Success': 'Complete or salvaged runs divided by all attempted runs.',

    'Thinking': 'Reasoning tokens reported within the model’s output-token count.',

  function hintedLabel(label, hint = metricHints[label]) {

    return el('span', { class: 'hinted-label' }, label,
      el('span', { class: 'hint-mark', tabindex: 0, title: hint, 'data-hint': hint, 'aria-label': accessibleLabel }, '?'),

  }

  function metricLabel(label, hint) { return hintedLabel(label, hint || metricHints[label]) }

  const usageSourceHints = {
    transcript: 'Read from the stored Claude Code transcript cost and usage records.',
    model: 'Summed from per-model usage recorded by the run result.',
    reported: 'Taken from the usage totals reported directly by the runner.',
    mixed: 'Different fields came from transcript, per-model, and runner-reported records.',
    derived: 'Calculated from other recorded usage fields.',

  function usageSourceLabel(source, asBadge = false) {
    const label = source || 'unavailable'
    return hintedLabel(asBadge ? badge(label, 'source') : label, usageSourceHints[label] || 'Recorded usage-data source.')
  }

  const hintTooltip = el('div', { class: 'hint-tooltip', role: 'tooltip', hidden: '' })
  document.body.append(hintTooltip)

  function showHint(mark) {
    const hint = mark && mark.dataset.hint
    if (!hint) return
    hintTooltip.textContent = hint
    hintTooltip.hidden = false
    const rect = mark.getBoundingClientRect()
    const tooltipRect = hintTooltip.getBoundingClientRect()
    const margin = 8
    const left = Math.max(margin, Math.min(window.innerWidth - tooltipRect.width - margin, rect.left + rect.width / 2 - tooltipRect.width / 2))
    let top = rect.bottom + margin
    if (top + tooltipRect.height > window.innerHeight - margin) top = Math.max(margin, rect.top - tooltipRect.height - margin)
    hintTooltip.style.left = `${left}px`
    hintTooltip.style.top = `${top}px`
  }

  function hideHint() { hintTooltip.hidden = true }

  document.addEventListener('mouseover', (event) => {
    const mark = event.target.closest && event.target.closest('.hint-mark')
    if (mark) showHint(mark)
  })
  document.addEventListener('mouseout', (event) => {
    const mark = event.target.closest && event.target.closest('.hint-mark')
    if (mark && !mark.contains(event.relatedTarget)) hideHint()
  })
  document.addEventListener('focusin', (event) => {
    const mark = event.target.closest && event.target.closest('.hint-mark')
    if (mark) showHint(mark)
  })
  document.addEventListener('focusout', (event) => {
    if (event.target.closest && event.target.closest('.hint-mark')) hideHint()
  })
  window.addEventListener('scroll', hideHint, true)
  window.addEventListener('resize', hideHint)

  const total = (items, getter) => {
    const values = items.map(getter).filter((value) => value != null && Number.isFinite(value))
    return values.length ? values.reduce((sum, value) => sum + value, 0) : null
  }

  const badge = (text, type = '') => el('span', { class: `badge ${type}`.trim() }, text)
  const hashLink = (label, hash, className) => el('a', { href: hash, class: className }, label)
  const externalLink = (label, href) => {
    try {
      const url = new URL(href)
      if (!['http:', 'https:'].includes(url.protocol)) throw new Error('unsupported protocol')
      return el('a', { href: url.href, target: '_blank', rel: 'noopener noreferrer' }, label)
    } catch (_) {
      return el('span', {}, label)
    }
  }

  const field = (label, control, extraClass = '') => el('div', { class: `field ${extraClass}`.trim() }, el('label', { for: control.id }, label), control)

  const select = (id, choices, selected, onChange) => {
    const control = el('select', { id, onchange: onChange })
    for (const [value, label] of choices) control.append(option(value, label, value === selected))
    control.value = selected
    return control
  }

  function frame(content) {
    const navLink = (label, view) => hashLink(label, `#${view}`, activeView === view ? 'active' : '')
    app.replaceChildren(
      el('div', { class: 'shell' },
        el('header', { class: 'topbar' },
          hashLink('', '#home', 'brand'),
          el('nav', { class: 'header-actions', 'aria-label': 'Dashboard navigation' },
            navLink('Summary', 'home'),
            navLink('Leaderboard', 'choose'),
            navLink('Compare', 'compare'),
            navLink('Insights', 'insights'),
            navLink('Findings', 'findings'),
            navLink('Runs', 'runs'),
          ),
        ),
        el('main', { id: 'main' }, content),
        el('footer', { class: 'footer' }, 'Generated from tracked benchmark artifacts · no network requests · no transcript scanning'),
      ),
    )
    const brand = document.querySelector('.brand')
    brand.append(el('span', { class: 'brand-mark', 'aria-hidden': 'true' }, 'RX'))
    brand.append(el('span', {}, el('strong', {}, 'Review Bench'), el('small', {}, 'Verified skill benchmark')))
  }

  function route() {
    const raw = location.hash.slice(1) || 'home'
    const [path, query = ''] = raw.split('?')
    const parts = path.split('/').map(decodeURIComponent)
    const params = new URLSearchParams(query)
    activeView = parts[0] === 'overview' ? 'runs' : parts[0]
    if (activeView === 'home') renderLanding(params)
    else if (parts[0] === 'run' && parts.length >= 3) renderRun(`${parts[1]}/${parts[2]}`)
    else if (parts[0] === 'compare' && parts.length >= 5) renderComparison(`${parts[1]}/${parts[2]}`, `${parts[3]}/${parts[4]}`)
    else if (activeView === 'choose') renderChoose(params)
    else if (activeView === 'compare') renderSkillCompare(params)
    else if (activeView === 'insights') renderInsights(params)
    else if (activeView === 'findings') renderFindings(params)
    else if (activeView === 'skills') renderSkills(parts[1] || null)
    else renderOverview(params)
    window.scrollTo({ top: 0, behavior: 'auto' })
  }

  const runHash = (run) => `#run/${encodeURIComponent(run.targetId)}/${encodeURIComponent(run.toolId)}`
  const compareHash = (left, right) => `#compare/${encodeURIComponent(left.targetId)}/${encodeURIComponent(left.toolId)}/${encodeURIComponent(right.targetId)}/${encodeURIComponent(right.toolId)}`
  const catalogueId = (toolId) => tools.get(toolId)?.catalogId || toolId
  const skillHash = (toolId) => `#skills/${encodeURIComponent(catalogueId(toolId))}`
  const skillInfoLink = (toolId) => hashLink('Skill info', skillHash(toolId), 'skill-info-link')

  function runsHash(rows) {
    const ids = [...new Set(rows.map((run) => run.id))]
    const params = new URLSearchParams()
    if (ids.length) params.set('runIds', ids.join(','))
    return '#runs' + (params.toString() ? '?' + params.toString() : '')
  }

  function runCountLink(rows, label = null) {

    const text = label || `${count} run${count === 1 ? '' : 's'}`
    return count ? hashLink(text, runsHash(rows), 'runs-link') : el('span', {}, text)
  }

  function runSetLink(rows, label) { return rows.length ? hashLink(label, runsHash(rows), 'runs-link') : label }

  function kpi(label, value, note) {
    return el('div', { class: 'kpi' }, el('span', {}, label), el('strong', {}, value), note ? el('small', {}, note) : null)
  }

    const next = new URLSearchParams(params)
    for (const [key, value] of Object.entries(patch)) {
      if (value == null || value === '') next.delete(key)
      else next.set(key, value)
    }
    location.hash = view + (next.toString() ? '?' + next.toString() : '')
  }

  const overviewParams = viewParams

  function values(params, key) {
    return (params.get(key) || '').split(',').map((value) => value.trim()).filter(Boolean)
  }

  function patchValues(params, key, value, checked) {
    const current = new Set(values(params, key))
    if (checked) current.add(value)
    else current.delete(value)
    viewParams(params, { [key]: [...current].join(',') })
  }

  function checklist(label, key, choices, params) {
    const selected = new Set(values(params, key))
    const summary = selected.size ? `${label} · ${selected.size}` : `${label} · All`
    return el('details', { class: 'filter-menu' },

        choices.map(([value, text]) => {
          const id = `filter-${key}-${String(value).replace(/[^a-z0-9]+/gi, '-')}`
          const box = el('input', { id, type: 'checkbox', checked: selected.has(value), onchange: (event) => patchValues(params, key, value, event.target.checked) })
          return el('label', { for: id }, box, el('span', {}, text))
        }),

    )
  }

  function filterBar(params, { search = false, status = false, skills = true } = {}) {
    const bar = el('section', { class: 'filter-bar', 'aria-label': 'Benchmark filters' })
    const linkedRuns = values(params, 'runIds')

    if (skills) bar.append(checklist('Skills', 'skills', DATA.tools.filter((tool) => DATA.runs.some((run) => run.toolId === tool.id)).map((tool) => [tool.id, tool.label]), params))

      checklist('Models', 'models', modelNames.map((model) => [model, model]), params),
      checklist('Languages', 'languages', languages.map((language) => [language, language]), params),

    if (status) bar.append(field('Runs', select('status-filter', [['all', 'All runs'], ['recommended', 'Useful only'], ['complete', 'Complete'], ['salvaged', 'Salvaged'], ['failed', 'Failed'], ['dnf', 'DNF']], params.get('status') || 'all', (event) => viewParams(params, { status: event.target.value === 'all' ? '' : event.target.value }))))
    if (search) {
      const input = el('input', { id: 'run-search', type: 'search', value: params.get('q') || '', placeholder: 'Search…', onchange: (event) => viewParams(params, { q: event.target.value.trim() }) })
      bar.append(field('Search', input, 'search'))
    }
    const hasFilters = ['skills', 'models', 'languages', 'targets', 'q', 'status', 'runIds'].some((key) => params.has(key))
    if (hasFilters) bar.append(el('button', { class: 'clear-filters', onclick: () => {
      const next = new URLSearchParams(params)
      for (const key of ['skills', 'models', 'languages', 'targets', 'q', 'status', 'runIds']) next.delete(key)
      location.hash = activeView + (next.toString() ? '?' + next.toString() : '')
    } }, 'Clear filters'))
    return bar
  }

  function matchesOverviewDimensions(run, params) {
    const selectedTargets = values(params, 'targets')
    const selectedTools = values(params, 'skills')
    const selectedModels = values(params, 'models')
    const selectedLanguages = values(params, 'languages')
    const target = targets.get(run.targetId)

      const falsePositive = rows.filter((row) => row.issue.verdict === 'false-positive').length
      const decided = real.length + falsePositive
      const universeAll = issueUniverse(targetIds, 'all').size
      const universeIn = issueUniverse(targetIds, 'in').size
      const severity = (allowed) => real.filter((row) => allowed.includes(row.issue.severity)).length
      const perTarget = targetIds.map((targetId) => {
        const targetRuns = group.runs.filter((run) => run.targetId === targetId)
        if (!targetRuns.length) return { targetId, completeness: null, efficiency: null }
        const targetCost = total(targetRuns, (run) => run.usage.costUsd)
        const targetReal = new Set()
        for (const run of targetRuns) for (const issue of run.issues) if (issue.verdict === 'real') targetReal.add(issueKey(targetId, issue))
        const denominator = issueUniverse([targetId], 'all').size
        return {
          targetId,
          completeness: denominator ? targetReal.size / denominator : null,
          efficiency: targetCost > 0 ? targetReal.size / targetCost : null,
        }
      })
      groups.push({
        ...group,
        targetIds,
        coverage: new Set(group.runs.map((run) => run.targetId).filter((id) => targetIds.includes(id))).size,
        allReal: real.length,
        inReal: inScope.length,
        efficiencyAll: group.cost > 0 ? real.length / group.cost : null,
        efficiencyIn: group.cost > 0 ? inScope.length / group.cost : null,
        severityHigh: group.cost > 0 ? severity(['high']) / group.cost : null,
        severityMedium: group.cost > 0 ? severity(['high', 'medium']) / group.cost : null,
        severityLow: group.cost > 0 ? severity(['high', 'medium', 'low']) / group.cost : null,
        completenessAll: universeAll ? real.length / universeAll : null,
        completenessIn: universeIn ? inScope.length / universeIn : null,

        decided,

  function paretoChart(groups) {
    const completeness = (group) => group.completenessAll ?? group.completeness

      const x = pad.left + i * (width - pad.left - pad.right) / 4
      const y = height - pad.bottom - i * (height - pad.top - pad.bottom) / 4
      graph.append(svg('line', { class: 'grid', x1: x, y1: pad.top, x2: x, y2: height - pad.bottom }))

    graph.append(svgLabel('Completeness', { class: 'axis-label', x: 13, y: (pad.top + height - pad.bottom) / 2, 'text-anchor': 'middle', transform: `rotate(-90 13 ${(pad.top + height - pad.bottom) / 2})` }, metricHints.Completeness))
    const frontierPoints = [...frontier].sort((a, b) => a.cost - b.cost).map((point) => `${scale(point.cost, maxCost, pad.left, width - pad.left - pad.right)},${height - pad.bottom - completeness(point) * (height - pad.top - pad.bottom)}`).join(' ')

        ' · Bubble size: ', metricLabel('False-positive rate'),

    ]
    return el('section', { class: 'panel' },
      el('div', { class: 'panel-head' }, el('div', {}, el('h2', {}, 'Upstream human review'), el('p', {}, 'Context only—not ground truth and never included in run scoring.')), externalLink('Open upstream PR ↗', truth.url)),
      el('div', { class: 'panel-body' },
        el('div', { class: 'notice info' }, 'The benchmark used the merged revision, after upstream review changes. Absence of one of these comments is not a miss.'),
        comments.length ? comments.map((comment) => el('article', { class: 'upstream-comment' }, el('strong', {}, comment.user), el('span', { class: 'subline' }, comment.type === 'inline' ? `${comment.path || 'file'}${comment.line ? ':' + comment.line : ''}` : 'PR thread'), el('p', {}, comment.body || ''))) : el('div', { class: 'empty' }, 'No human review comments stored.'),
      ),
    )
  }

  const comparisonMetrics = [
    ['Cost', (run) => run.usage.costUsd, 'money', 'lower'],
    ['Wall time', (run) => run.wallMs, 'minutes', 'lower'],
    ['Tokens', (run) => run.usage.total, 'number', 'lower'],
    ['Extracted claims', (run) => run.metrics.claims, 'number', 'neutral'],
    ['Real findings', (run) => run.metrics.real, 'number', 'higher'],
    ['False positives', (run) => run.metrics.falsePositive, 'number', 'lower'],
    ['Unproven', (run) => run.metrics.unproven, 'number', 'neutral'],
    ['In-scope real', (run) => run.metrics.inScope, 'number', 'higher'],
    ['PR-introduced real', (run) => run.metrics.prIntroduced, 'number', 'higher'],
    ['Unique real', (run) => run.metrics.uniqueReal, 'number', 'higher'],
    ['Precision', (run) => run.metrics.precision, 'percent', 'higher'],
    ['Real / dollar', (run) => run.metrics.realPerDollar, 'number', 'higher'],
    ['Cost / real', (run) => run.metrics.costPerReal, 'money', 'lower'],
    ['Minutes / real', (run) => run.metrics.minutesPerReal, 'number', 'lower'],
  ]

  function renderComparison(leftId, rightId) {
    const left = runs.get(leftId), right = runs.get(rightId)
    if (!left || !right) return renderNotFound('Comparison not found', `${leftId} ↔ ${rightId}`)
    const overlap = comparisonData(left, right)
    const content = el('div', {},
      hero('Two-run comparison', `${left.toolLabel} vs ${right.toolLabel}`, `${left.targetId} ↔ ${right.targetId}`, [hashLink('Overview', '#overview'), ' / ', 'Comparison']),
      el('section', { class: 'panel' },
        el('div', { class: 'panel-body compare-head' }, compareRun(left), el('div', { class: 'versus' }, 'VERSUS'), compareRun(right)),
      ),
      comparisonTable(left, right),
      comparisonCharts(left, right),
      overlapSection(overlap),
    )
    frame(content)
  }

  function compareRun(run) {
    return el('div', { class: 'compare-run' }, hashLink(run.toolLabel, runHash(run), 'run-link'), el('span', { class: 'subline' }, hashLink(run.id, runHash(run), 'run-link'), ' · ', skillInfoLink(run.toolId)), el('div', { class: 'badges' }, badge(run.status, run.status), usageSourceLabel(run.usage.source, true)))
  }

  function comparisonTable(left, right) {
    const body = el('tbody')
    for (const [label, getter, kind, direction] of comparisonMetrics) {
      const a = getter(left), b = getter(right)
      const delta = a == null || b == null ? null : b - a
      const ratio = a > 0 && b != null ? b / a : null
      let quality = ''
      if (delta && direction !== 'neutral') quality = (direction === 'higher' ? delta > 0 : delta < 0) ? 'good' : 'bad'
      const deltaText = delta == null ? 'N/A' : `${delta > 0 ? '+' : ''}${kind === 'money' ? fmt(delta, 'money') : kind === 'percent' ? (delta * 100).toFixed(1) + ' pp' : kind === 'minutes' ? fmt(delta, 'minutes') : fmt(delta)}`
      body.append(el('tr', {}, el('td', {}, metricLabel(label)), el('td', { class: 'num' }, fmt(a, kind)), el('td', { class: 'num' }, fmt(b, kind)), el('td', { class: `num delta ${quality}` }, deltaText), el('td', { class: 'num' }, fmt(ratio, 'ratio'))))
    }
    return el('section', { class: 'panel' }, el('div', { class: 'panel-head' }, el('div', {}, el('h2', {}, 'Metric deltas'), el('p', {}, 'Delta and ratio are right relative to left.'))), el('div', { class: 'table-wrap' }, el('table', {}, el('thead', {}, el('tr', {}, el('th', {}, 'Metric'), el('th', { class: 'num' }, 'Left'), el('th', { class: 'num' }, 'Right'), el('th', { class: 'num' }, metricLabel('Δ')), el('th', { class: 'num' }, metricLabel('Ratio')))), body)))
  }

  function comparisonCharts(left, right) {
    const tokenFields = [['input', 'Input'], ['output', 'Output'], ['cacheRead', 'Cache read'], ['cacheCreation', 'Cache create'], ['thinking', 'Thinking']]
    const maxToken = Math.max(0, ...tokenFields.flatMap(([key]) => [left.usage[key] || 0, right.usage[key] || 0]))
    const tokensFor = (run) => el('div', {},
      el('h3', {}, run.toolLabel),
      tokenFields.map(([key, label]) => el('div', { class: 'token-row' },
        metricLabel(label),
        el('div', { class: 'track' }, el('span', { style: `width:${maxToken ? (run.usage[key] || 0) / maxToken * 100 : 0}%` })),
        el('strong', {}, fmt(run.usage[key], 'compact')),
      )),
    )
    const barMetrics = [['Real', (run) => run.metrics.real], ['In scope', (run) => run.metrics.inScope], ['Precision', (run) => run.metrics.precision], ['Real / $', (run) => run.metrics.realPerDollar]]
    return el('section', { class: 'charts' },
      el('div', { class: 'panel' }, el('div', { class: 'panel-head' }, el('h2', {}, 'Token mix')), el('div', { class: 'panel-body token-bars' }, tokensFor(left), tokensFor(right))),
      el('div', { class: 'panel' }, el('div', { class: 'panel-head' }, el('h2', {}, 'Quality & efficiency')), el('div', { class: 'panel-body metric-bars' }, barMetrics.map(([label, getter]) => {
        const a = getter(left), b = getter(right), max = Math.max(a || 0, b || 0)
        return el('div', { class: 'metric-bar' }, el('span', { class: 'muted' }, metricLabel(label)), el('div', { class: 'paired-track' }, el('div', { class: 'track', title: `Left: ${fmt(a)}` }, el('span', { style: `width:${max ? (a || 0) / max * 100 : 0}%` })), el('div', { class: 'track', title: `Right: ${fmt(b)}` }, el('span', { style: `width:${max ? (b || 0) / max * 100 : 0}%` }))))
      }))),
    )
  }

  function comparisonData(left, right) {
    if (left.targetId !== right.targetId) return { compatible: false, reason: 'Issue overlap is unavailable because these runs reviewed different targets.', shared: [], leftOnly: [], rightOnly: [] }
    const leftMap = new Map(left.issues.map((issue) => [issue.id, issue]))
    const rightMap = new Map(right.issues.map((issue) => [issue.id, issue]))
    return {
      compatible: true,
      shared: [...leftMap.keys()].filter((id) => rightMap.has(id)).map((id) => leftMap.get(id)),
      leftOnly: [...leftMap.keys()].filter((id) => !rightMap.has(id)).map((id) => leftMap.get(id)),
      rightOnly: [...rightMap.keys()].filter((id) => !leftMap.has(id)).map((id) => rightMap.get(id)),
    }
  }

  function overlapSection(overlap) {
    if (!overlap.compatible) return el('section', { class: 'panel' }, el('div', { class: 'panel-head' }, el('h2', {}, 'Judged issue overlap')), el('div', { class: 'panel-body' }, el('div', { class: 'notice' }, overlap.reason)))
    const column = (title, issues) => el('div', { class: 'overlap-column' },
      el('h3', {}, `${title} · ${issues.length}`),
      el('div', { class: 'issue-list' }, ...(issues.length ? issues.map((issue) => issueCard(issue, false)) : [el('div', { class: 'empty' }, 'None')])),
    )
    return el('section', { class: 'panel' }, el('div', { class: 'panel-head' }, el('div', {}, el('h2', {}, 'Judged issue overlap'), el('p', {}, 'Matched by stable judgement ID within the same target.'))), el('div', { class: 'panel-body overlap-grid' }, column('Shared', overlap.shared), column('Left only', overlap.leftOnly), column('Right only', overlap.rightOnly)))
  }

  function renderNotFound(title, detail) {
    frame(el('div', {}, hero('Unknown route', title, detail, [hashLink('Return to overview', '#overview')]), el('div', { class: 'notice' }, 'The requested dashboard record is not embedded in this export.')))
  }

  window.addEventListener('hashchange', route)
  route()
})()
</script>
</body>
</html>
