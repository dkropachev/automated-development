<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="A verified benchmark of Claude Code review skills, with clear findings-per-dollar and completeness-per-dollar leaders">
<title>Review Bench · Claude Code review skill benchmark</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0a0d12;
  --panel: #11161e;
  --panel-2: #171e28;
  --line: #293442;
  --muted: #94a3b8;
  --text: #ecf3fa;
  --accent: #67e8c1;
  --accent-2: #77a7ff;
  --warn: #f4bf62;
  --danger: #fb7185;
  --good: #65d48a;
  --radius: 13px;
  --shadow: 0 16px 45px rgb(0 0 0 / 22%);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-variant-numeric: tabular-nums;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: radial-gradient(circle at 10% -10%, #163044 0, transparent 28rem), var(--bg); color: var(--text); }
body, button, input, select { font: inherit; }
button, input, select { color: inherit; }
a { color: var(--accent-2); }
a:hover { color: #a9c5ff; }
button, select, input { border: 1px solid var(--line); border-radius: 8px; background: #0d1219; padding: .58rem .7rem; }
button { cursor: pointer; }
button:hover { border-color: #4a5c70; background: #171e28; }
button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, [tabindex="0"]:focus-visible { outline: 3px solid rgb(103 232 193 / 40%); outline-offset: 2px; }
button.primary { border-color: #278c74; background: #146b58; color: white; }
button.primary:hover { background: #188069; }
button:disabled { opacity: .45; cursor: not-allowed; }

.skip-link { position: fixed; left: 1rem; top: -5rem; z-index: 50; padding: .75rem 1rem; border-radius: 8px; background: var(--accent); color: #06130f; }
.skip-link:focus { top: 1rem; }
.shell { width: min(1480px, calc(100% - 2rem)); margin: 0 auto; padding-bottom: 4rem; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.35rem 0; }
.brand { display: flex; align-items: center; gap: .75rem; color: inherit; text-decoration: none; }
.brand-mark { display: grid; place-items: center; width: 2.25rem; height: 2.25rem; border: 1px solid #3e8476; border-radius: 9px; background: linear-gradient(145deg, #1a735f, #183e5b); color: #cafff0; font-weight: 800; }
.brand strong { display: block; letter-spacing: -.02em; }
.brand small, .muted { color: var(--muted); }
.header-actions { display: flex; gap: .5rem; align-items: center; }
.header-actions a { color: var(--muted); text-decoration: none; padding: .55rem; }
.header-actions a.active { border-radius: 7px; background: var(--panel-2); color: var(--text); }

.hero { padding: 2.3rem 0 1.2rem; }
.eyebrow { color: var(--accent); font-size: .75rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
h1, h2, h3 { letter-spacing: -.025em; }
h1 { max-width: 800px; margin: .35rem 0 .7rem; font-size: clamp(2rem, 5vw, 4.25rem); line-height: 1.02; }
h2 { margin: 0; font-size: 1.25rem; }
h3 { margin: 0; font-size: 1rem; }
.hero p { max-width: 760px; color: var(--muted); font-size: 1.02rem; line-height: 1.6; }
.compact-hero { padding: 1.25rem 0 .75rem; }
.compact-hero h1 { max-width: 980px; font-size: clamp(2rem, 4vw, 3.4rem); }
.compact-hero p { max-width: 920px; margin-bottom: .5rem; }
.breadcrumb { display: flex; flex-wrap: wrap; gap: .45rem; color: var(--muted); font-size: .86rem; margin-top: 1.2rem; }
.breadcrumb a { color: var(--muted); }

.landing-hero { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(260px, .65fr); gap: 2rem; align-items: end; padding: 4rem 0 2rem; }
.landing-hero h1 { max-width: 920px; }
.landing-hero p { max-width: 760px; margin-bottom: 0; }
.hero-actions { display: flex; flex-wrap: wrap; gap: .65rem; margin-top: 1.35rem; }
.hero-actions .button-link { padding: .7rem .9rem; }
.landing-proof { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; }
.landing-proof div { padding: .9rem; border-left: 1px solid var(--line); }
.landing-proof strong, .landing-proof span { display: block; }
.landing-proof strong { color: var(--accent); font-size: 1.45rem; }
.landing-proof span { margin-top: .3rem; color: var(--muted); font-size: .75rem; }
.landing-section { margin-top: 2.4rem; }
.landing-section-head { display: flex; justify-content: space-between; align-items: end; gap: 1rem; margin-bottom: 1rem; }
.landing-section-head h2 { font-size: 1.75rem; }
.landing-section-head p { max-width: 680px; margin: .35rem 0 0; color: var(--muted); line-height: 1.5; }
.leader-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.value-leader-card .eyebrow { margin-bottom: .8rem; font-size: .7rem; }
.value-leader-card .subline { margin-top: .75rem; }
.method-note { margin-top: .75rem; color: var(--muted); font-size: .78rem; line-height: 1.45; }
.skill-summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; }
.skill-summary-card { display: flex; min-width: 0; flex-direction: column; padding: 1rem; border: 1px solid var(--line); border-radius: 10px; background: rgb(17 22 30 / 82%); }
.skill-summary-card h3 { line-height: 1.35; }
.skill-summary-card h3 a { color: var(--text); text-decoration: none; }
.skill-summary-card h3 a:hover { color: var(--accent); }
.skill-summary-card p { margin: .65rem 0; color: #c5cfda; font-size: .88rem; line-height: 1.5; }
.skill-summary-card .skill-facts { margin-top: auto; color: var(--muted); font-size: .75rem; }
.skill-summary-card .badge { margin-bottom: .7rem; }
.landing-picker { min-width: 180px; }
.completeness-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .8rem; }
.rank-card { position: relative; padding: 1.1rem; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(145deg, rgb(26 36 48 / 85%), rgb(13 18 25 / 90%)); }
.rank-card h3 { max-width: calc(100% - 2.5rem); line-height: 1.35; }
.rank-card h3 a { color: var(--text); text-decoration: none; }
.rank-card h3 a:hover { color: var(--accent); }
.rank-card > strong { display: block; margin-top: 1rem; color: var(--accent); font-size: 2rem; }
.rank-card p { margin: .35rem 0 0; color: var(--muted); font-size: .78rem; }
.rank-number { position: absolute; top: 1rem; right: 1rem; color: var(--muted); font-size: .75rem; font-weight: 750; }

.kpis { display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)); gap: .75rem; margin: 1rem 0; }
.kpi { min-height: 106px; padding: 1rem; border: 1px solid var(--line); border-radius: var(--radius); background: linear-gradient(150deg, rgb(26 36 48 / 85%), rgb(13 18 25 / 90%)); box-shadow: var(--shadow); }
.kpi span { display: block; color: var(--muted); font-size: .76rem; letter-spacing: .06em; text-transform: uppercase; }
.kpi strong { display: block; margin-top: .65rem; font-size: 1.65rem; line-height: 1; }
.kpi small { display: block; margin-top: .45rem; color: var(--muted); }

.panel { border: 1px solid var(--line); border-radius: var(--radius); background: rgb(17 22 30 / 92%); box-shadow: var(--shadow); overflow: hidden; }
.panel + .panel { margin-top: 1rem; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1rem 1.1rem; border-bottom: 1px solid var(--line); }
.panel-head p { margin: .2rem 0 0; color: var(--muted); font-size: .83rem; }
.panel-body { padding: 1rem 1.1rem; }
.controls { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: .65rem; padding: 1rem; border-bottom: 1px solid var(--line); }
.filter-bar { position: sticky; top: .5rem; z-index: 7; display: flex; align-items: end; flex-wrap: wrap; gap: .6rem; margin: .75rem 0 1rem; padding: .75rem; border: 1px solid var(--line); border-radius: 12px; background: rgb(14 19 26 / 96%); box-shadow: 0 8px 30px rgb(0 0 0 / 28%); }
.filter-menu { position: relative; min-width: 145px; }
.filter-menu summary { cursor: pointer; list-style: none; padding: .58rem .7rem; border: 1px solid var(--line); border-radius: 8px; background: #0d1219; color: var(--text); }
.filter-menu summary::-webkit-details-marker { display: none; }
.filter-menu summary::after { float: right; margin-left: .8rem; color: var(--muted); content: "▾"; }
.filter-popover { position: absolute; top: calc(100% + .35rem); left: 0; z-index: 12; display: grid; min-width: 280px; max-height: 360px; padding: .45rem; overflow: auto; border: 1px solid var(--line); border-radius: 10px; background: #111821; box-shadow: var(--shadow); }
.filter-popover label { display: grid; grid-template-columns: auto 1fr; gap: .55rem; align-items: start; padding: .55rem; border-radius: 7px; color: #d2dce7; font-size: .82rem; line-height: 1.35; }
.filter-popover label:hover { background: var(--panel-2); }
.filter-popover input { margin-top: .1rem; }
.filter-bar .field { min-width: 145px; }
.filter-bar .search { flex: 1; }
.linked-run-set { align-self: center; padding: .45rem .6rem; border: 1px solid #3c5268; border-radius: 99px; color: #bddff4; font-size: .76rem; white-space: nowrap; }
.clear-filters { margin-left: auto; }
.field { display: grid; gap: .35rem; }
.field label { color: var(--muted); font-size: .74rem; font-weight: 650; letter-spacing: .04em; text-transform: uppercase; }
.field.search { grid-column: span 1; }
.compact-controls { display: flex; align-items: end; flex-wrap: wrap; gap: .6rem; }
.compact-controls .field { min-width: 135px; }

.table-wrap { overflow: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: .76rem .8rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
th { position: sticky; top: 0; z-index: 1; background: #151c25; color: #b6c2d1; font-size: .72rem; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
tbody tr:hover { background: rgb(119 167 255 / 5%); }
tbody tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.sort-button { border: 0; padding: 0; border-radius: 3px; background: transparent; color: inherit; font-size: inherit; letter-spacing: inherit; text-transform: inherit; }
.sort-button:hover { background: transparent; color: white; }
.heading-with-hint, .hinted-label { display: inline-flex; align-items: center; gap: .3rem; }
.hint-mark { display: inline-grid; place-items: center; width: 1rem; height: 1rem; flex: 0 0 auto; border: 1px solid #627286; border-radius: 50%; color: #b9c7d8; font-size: .66rem; font-style: normal; font-weight: 800; letter-spacing: 0; line-height: 1; text-transform: none; cursor: help; }
.hint-tooltip { position: fixed; z-index: 100; width: max-content; max-width: min(19rem, calc(100vw - 1rem)); padding: .48rem .58rem; border: 1px solid #526174; border-radius: 7px; background: #070b10; box-shadow: 0 8px 24px rgb(0 0 0 / 45%); color: #e5edf6; font-size: .74rem; font-weight: 500; letter-spacing: normal; line-height: 1.35; text-align: left; text-transform: none; white-space: normal; pointer-events: none; }
.hint-tooltip[hidden] { display: none; }
.axis-label { fill: #c8d3df !important; font-weight: 650; }
.metric-definition { justify-content: flex-end; }
.run-link { color: var(--text); font-weight: 680; text-decoration: none; }
.run-link:hover { color: var(--accent); }
.runs-link { color: inherit; text-decoration-color: rgb(119 167 255 / 60%); text-underline-offset: .16em; }
.runs-link:hover { color: var(--accent-2); }
.skill-info-link { color: var(--accent-2); text-decoration-color: rgb(119 167 255 / 45%); text-underline-offset: .16em; }
.subline { display: block; margin-top: .25rem; color: var(--muted); font-size: .77rem; }
.empty { padding: 2.5rem 1rem; color: var(--muted); text-align: center; }

.badge { display: inline-flex; align-items: center; gap: .3rem; width: fit-content; padding: .22rem .48rem; border: 1px solid var(--line); border-radius: 99px; background: #151b24; color: #c5d0dd; font-size: .69rem; font-weight: 720; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; }
.badge::before { width: .4rem; height: .4rem; border-radius: 50%; background: currentColor; content: ""; }
.badge.complete, .badge.real { border-color: #245b3b; color: var(--good); }
.badge.salvaged, .badge.unproven { border-color: #665024; color: var(--warn); }
.badge.failed, .badge.dnf, .badge.false-positive { border-color: #693240; color: var(--danger); }
.badge.in-scope { color: var(--accent); }
.badge.out-of-scope { color: var(--muted); }
.badge.source { color: var(--accent-2); }

.compare-dock { position: sticky; bottom: 1rem; z-index: 8; display: flex; justify-content: space-between; align-items: center; gap: 1rem; width: min(640px, calc(100% - 1rem)); margin: 1rem auto 0; padding: .8rem 1rem; border: 1px solid #3c5268; border-radius: 12px; background: rgb(18 27 37 / 96%); box-shadow: 0 14px 40px rgb(0 0 0 / 50%); }
.button-link { display: inline-block; padding: .58rem .7rem; border: 1px solid var(--line); border-radius: 8px; color: inherit; text-decoration: none; }
.button-link.primary { border-color: #278c74; background: #146b58; color: white; }
.decision-controls { min-width: min(100%, 390px); }
.decision-kpis { grid-template-columns: repeat(4, minmax(140px, 1fr)); }
.evidence-note { margin: 1rem 0; }
.selection-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(245px, 1fr)); gap: .65rem; margin: 1rem 0; }
.selection-card { display: grid; grid-template-columns: auto 1fr; gap: .65rem; align-items: start; padding: .85rem; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; }
.selection-card:hover, .selection-card.selected { border-color: #397d6e; background: #13231f; }
.selection-card strong, .selection-card small { display: block; }
.selection-card small { margin-top: .3rem; color: var(--muted); }

.skill-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem; }
.skill-grid.focused { grid-template-columns: minmax(0, 760px); }
.catalogue-back { margin: .2rem 0 1rem; }
.skill-card { display: flex; min-width: 0; flex-direction: column; gap: .85rem; padding: 1rem 1.1rem; border: 1px solid var(--line); border-radius: var(--radius); background: rgb(17 22 30 / 92%); box-shadow: var(--shadow); }
.skill-card-head { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
.skill-card h2 { line-height: 1.25; }
.skill-card > p { margin: 0; color: #c5cfda; line-height: 1.5; }
.skill-usage { display: grid; gap: .65rem; margin: 0; }
.skill-usage > div { display: grid; grid-template-columns: 4.2rem minmax(0, 1fr); gap: .6rem; align-items: start; }
.skill-usage dt { color: var(--muted); font-size: .72rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.skill-usage dd { min-width: 0; margin: 0; }
.skill-usage code { display: block; padding: .55rem .65rem; overflow: auto; border: 1px solid var(--line); border-radius: 7px; background: #090d12; color: #d8e3ed; font: .73rem/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
.skill-actions { display: flex; flex-wrap: wrap; gap: .55rem; margin-top: auto; }
.skill-actions a { padding: .45rem .6rem; border: 1px solid var(--line); border-radius: 7px; text-decoration: none; }

.charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 1rem; }
.chart-panel { min-width: 0; }
.chart { width: 100%; height: auto; min-height: 300px; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; }
.chart .grid { stroke: #26303d; stroke-width: 1; }
.chart .axis { stroke: #637083; stroke-width: 1; }
.chart .point { cursor: pointer; stroke: #07100e; stroke-width: 2; transition: r .15s ease; }
.chart .point:hover, .chart .point:focus { r: 8; fill: white; outline: none; }
.chart .chart-link { cursor: pointer; text-decoration: underline; }
.chart .chart-link:hover, .chart .chart-link:focus { fill: white; outline: none; }
.chart .bar { fill: var(--accent-2); }
.chart .bar-alt { fill: var(--accent); }
.chart .na { fill: #3a4553; }
.chart-key { display: flex; flex-wrap: wrap; gap: .7rem; margin-top: .4rem; color: var(--muted); font-size: .72rem; }
.key-dot { display: inline-block; width: .58rem; height: .58rem; margin-right: .25rem; border-radius: 50%; }
.chart .frontier { fill: none; stroke: var(--accent); stroke-width: 2; stroke-dasharray: 5 4; }
.chart .analysis-point { opacity: .82; stroke: #07100e; stroke-width: 2; }
.chart .frontier-point { stroke: white; stroke-width: 2.5; }

.analysis-section { margin-top: 1.4rem; }
.analysis-intro { display: flex; justify-content: space-between; gap: 1rem; margin: 2rem 0 1rem; }
.analysis-intro h2 { margin-top: .3rem; font-size: 1.8rem; }
.analysis-intro p { max-width: 900px; margin: .55rem 0 0; color: var(--muted); line-height: 1.55; }
.analysis-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.analysis-grid .panel { margin-top: 0; }
.series-chart, .range-chart { display: grid; gap: .8rem; }
.series-key { display: flex; flex-wrap: wrap; gap: .8rem; color: var(--muted); font-size: .72rem; }
.series-key i { display: inline-block; width: .65rem; height: .65rem; margin-right: .3rem; border-radius: 2px; }
.series-row { display: grid; grid-template-columns: minmax(155px, 1fr) 1.35fr; gap: .8rem; align-items: center; }
.analysis-label { min-width: 0; }
.analysis-label strong { display: block; overflow: hidden; font-size: .8rem; text-overflow: ellipsis; white-space: nowrap; }
.analysis-label > span { display: block; margin-top: .2rem; overflow: hidden; color: var(--muted); font-size: .65rem; text-overflow: ellipsis; white-space: nowrap; }
.series-bars { display: grid; gap: .3rem; }
.series-bar { position: relative; height: 1rem; border-radius: 3px; background: #252e3a; }
.series-bar > span { display: block; min-width: 1px; height: 100%; border-radius: inherit; opacity: .78; }
.series-bar > b { position: absolute; top: 50%; right: .3rem; color: white; font-size: .63rem; line-height: 1; text-shadow: 0 1px 2px #000; transform: translateY(-50%); }
.range-row { display: grid; grid-template-columns: minmax(155px, 1fr) 1.25fr 7.7rem; gap: .8rem; align-items: center; }
.range-track { position: relative; height: .55rem; border-radius: 99px; background: #29313d; }
.range-line { position: absolute; top: 0; height: 100%; min-width: 2px; border-radius: inherit; background: var(--accent-2); }
.range-track i { position: absolute; top: -.22rem; width: .18rem; height: 1rem; border-radius: 2px; background: var(--accent); transform: translateX(-50%); }
.range-values { color: var(--muted); font-size: .67rem; text-align: right; white-space: nowrap; }

.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(140px, 1fr)); gap: .75rem; }
.summary-item { padding: .9rem; border: 1px solid var(--line); border-radius: 9px; background: #0e131a; }
.summary-item dt { color: var(--muted); font-size: .72rem; text-transform: uppercase; }
.summary-item dd { margin: .45rem 0 0; overflow-wrap: anywhere; font-weight: 650; }
.summary-item dd small { display: block; margin-top: .25rem; color: var(--muted); font-weight: 400; }
.section-stack { display: grid; gap: 1rem; margin-top: 1rem; }
.notice { padding: .85rem 1rem; border: 1px solid #624f29; border-radius: 9px; background: rgb(89 64 23 / 22%); color: #f7dca7; line-height: 1.5; }
.notice.info { border-color: #294d65; background: rgb(31 70 95 / 22%); color: #bddff4; }

.issue-list { display: grid; gap: .65rem; }
.issue { padding: .9rem; border: 1px solid var(--line); border-radius: 9px; background: #0e131a; }
.issue-head { display: flex; justify-content: space-between; align-items: start; gap: 1rem; }
.issue h3 { line-height: 1.4; }
.badges { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .55rem; }
.issue p { margin: .75rem 0 0; color: #c5cfda; line-height: 1.55; }
.where { color: var(--accent-2); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8rem; }

details.raw { border-top: 1px solid var(--line); }
details.raw:first-child { border-top: 0; }
details.raw summary { cursor: pointer; padding: .9rem 1.1rem; font-weight: 660; }
.raw-tools { display: flex; gap: .5rem; padding: 0 1.1rem .65rem; }
.raw-tools input { width: min(440px, 100%); }
pre { max-height: 560px; margin: 0; padding: 1rem 1.1rem; overflow: auto; border-top: 1px solid var(--line); background: #090d12; color: #cbd6e1; font: .79rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }

.compare-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 1rem; align-items: center; }
.compare-run { padding: 1rem; border: 1px solid var(--line); border-radius: 10px; background: #0e131a; }
.compare-run:last-child { text-align: right; }
.versus { color: var(--muted); font-size: .75rem; font-weight: 800; letter-spacing: .08em; }
.delta.good { color: var(--good); }
.delta.bad { color: var(--danger); }
.token-bars { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.token-row { display: grid; grid-template-columns: 7.5rem 1fr auto; gap: .6rem; align-items: center; margin: .55rem 0; color: var(--muted); font-size: .78rem; }
.track { height: .55rem; overflow: hidden; border-radius: 99px; background: #29313d; }
.track span { display: block; height: 100%; border-radius: inherit; background: var(--accent-2); }
.token-bars > div:last-child .track span { background: var(--accent); }
.metric-bars { display: grid; gap: .7rem; }
.metric-bar { display: grid; grid-template-columns: 8rem 1fr; gap: .75rem; align-items: center; }
.paired-track { display: grid; gap: .28rem; }
.paired-track .track:nth-child(2) span { background: var(--accent); }

003csummary>🤖 Prompt for AI Agents\u003c/summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@scylla/src/network/connection_pool.rs` around lines 1239 - 1245, Update the\nUSE-failure path in start_opening_connection, specifically the\nConnectionSetupError::Keyspace mapping, to decrement or otherwise balance the\nconnection metric before the failed connection is dropped. Preserve normal\nmetric accounting for successful keyspace setup and ensure repeated keyspace\nfailures cannot inflate the active-connection count.\n```\n\n\u003c/details>\n\n\u003c!-- fingerprinting:phantom:poseidon:terra -->\n\n\u003c!-- cr-indicator-types:potential_issue -->\n\n\u003c!-- cr-comment:v1:8aa019a5c515e938163d3e04 -->\n\n\u003c!-- This is an auto-generated comment by CodeRabbit -->\n\n✅ Addressed in commit 0c52e29"},{"user":"Copilot","path":"scylla/src/network/connection_pool.rs","line":902,"body":"When keyspace setup fails for the first connection, this branch leaves `shared_conns` as `Initializing` and never notifies `pool_updated_notify`. Consequently, `wait_until_all_pools_are_initialized()` can block forever during session startup or metadata refresh when `USE` fails persistently. Connection-open failures transition an empty pool to `Broken` via `update_shared_conns`; keyspace setup failures also need to complete initialization (while retaining the refill/backoff behavior), with an error representation that can preserve the keyspace failure."},{"user":"coderabbitai[bot]","path":"scylla/src/network/connection_pool.rs","line":911,"body":"_🩺 Stability & Availability_ | _🟠 Major_ | _🏗️ Heavy lift_\n\n**Persistent keyspace failure can leave the pool stuck in `Initializing`.**\n\nThis arm never touches `shared_conns` nor signals `pool_updated_notify`. If the first connection to a node always fails at `USE` (missing keyspace, no permission), every refill lands here, so the pool stays `Initializing` forever: `wait_until_initialized()` (Line 433) never wakes and `with_connections` keeps returning `ConnectionPoolError::Initializing` instead of a `Broken` error naming the real cause.\n\nThe connection-failure arm handles this via `update_shared_conns(Some(err))` when `!self.is_filling() && self.is_empty()`, but that path needs a `ConnectionError` while `Broken` cannot carry a `UseKeyspaceError` today. Consider widening the error stored in `MaybePoolConnections::Broken` (or at minimum notifying `pool_updated_notify` so waiters stop hanging) when this is the terminal failure of a fill attempt on an empty pool.\n\n\u003cdetails>\n\u003csummary>🤖 Prompt for AI Agents\u003c/summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nIn `@scylla/src/network/connection_pool.rs` around lines 897 - 904, Update the\nConnectionSetupError::Keyspace arm to handle a terminal fill failure when the\npool is empty and no refill is active, using update_shared_conns to transition\nMaybePoolConnections::Broken and preserve the UseKeyspaceError cause. Widen the\nBroken error representation as needed, and ensure pool_updated_notify is\nsignaled so wait_until_initialized and with_connections stop reporting\nInitializing; retain the current metrics and logging behavior for nonterminal\nfailures.\n```\n\n\u003c/details>\n\n\u003c!-- fingerprinting:phantom:medusa:komodo -->\n\n\u003c!-- cr-indicator-types:potential_issue -->\n\n\u003c!-- cr-comment:v1:aa7ea9106b7f5ac33a716493 -->\n\n\u003c!-- This is an auto-generated comment by CodeRabbit -->\n\n✅ Addressed in commit 27ed7d1"},{"user":"Guflly","path":"scylla/src/network/connection_pool.rs","line":902,"body":"Fixed in 27ed7d10. The last failed keyspace setup now marks an empty pool as broken and wakes initialization waiters. The original UseKeyspaceError is kept, and the test covers both the state and notification rofile**: CHILL\n\n**Plan**: Pro Plus\n\n**Run ID**: `062de07a-3371-4617-b3ba-47d5bc43934d`\n\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>📥 Commits\u003c/summary>\n\nReviewing files that changed from the base of the PR and between 0c52e2923146fedf112c19c58480edfb3a9769f2 and fde9ac5d0d997aa4b257e5221358a6d40a995814.\n\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>📒 Files selected for processing (1)\u003c/summary>\n\n* `scylla/src/network/connection_pool.rs`\n\n\u003c/details>\n\n\u003c/details>\n\n\u003c!-- This is an auto-generated comment by CodeRabbit for review status -->"},{"user":"Guflly","state":"COMMENTED","body":""},{"user":"Guflly","state":"COMMENTED","body":""},{"user":"wprzytula","state":"CHANGES_REQUESTED","body":"I reviewed this manually and it looks good.\r\n\r\nThen I ran Opus review and the important insights are the following:\r\n\r\n1. > One design note (not a bug): a transient `UseKeyspaceError::RequestTimeout` now discards an otherwise-healthy TCP connection rather than retrying the `USE` on it. That's safe and simpler, but slightly wasteful. Worth a one-line comment acknowledging the choice.\r\n\r\n2. Error handling:\r\n>   - Log level inconsistency: keyspace arm uses `warn!`, the connection arm uses `debug!`. Defensible, but worth aligning intentionally.\r\n>   - The new `ConnectionError::UseKeyspaceError` is a **new public enum variant**, so the checklist item \"No public items were introduced\" is technically inaccurate. It's non-breaking (`ConnectionError` is `#[non_exhaustive]`), and semantically fits (\"connection can no longer be used and should be dropped\"). Just flag it as a public-API addition.\r\n\r\n3. > Tests — correct, readable, non-flaky, but one coverage gap\r\n>  Gaps / suggestions:\r\n>   - **No unit test for the success path after the reorder** (keyspace set OK → connection added, pool resharded correctly). The happy path is covered by `scylla/tests/integration/session/use_keyspace.rs`, but a focused unit test would round out coverage of the reordered branch and guard against future regressions.\r\n>   - In test 1, `requested_shard: Some(...)` is used specifically to prove no shard-aware fallback fires on keyspace failure — good — but a short comment would make that intent explicit to readers.\r\n\r\n\u003cdetails>\u003csummary>Full review here.\u003c/summary>\r\n\u003cp>\r\n\r\n\r\n# Assistant (Plan · Claude Opus 4.8 · 36.5s)\r\n\r\n## Summary of the PR\r\n\r\nThe PR fixes issue #1682: a connection whose `USE keyspace` failed during setup was still being added to the pool (the old `start_setting_keyspace_for_connection` returned `Ok((connection, ...))` even on failure). Such a connection could serve queries against the wrong/default keyspace. The fix threads a new `ConnectionSetupError { Connection, Keyspace }` enum through `OpenedConnectionEvent`, so a keyspace failure is now a distinct error variant that discards the connection and triggers a refill.\r\n\r\nThree commits:\r\n1. `discard connections after keyspace setup failure` — core fix\r\n2. `finish setup before updating pool` — moves the keyspace-check to the **top** of the `Ok` arm, before `maybe_reshard`/shard-awareness/shard-port updates\r\n3. `report terminal keyspace setup failures` — reports the error into `shared_conns` and adds `ConnectionError::UseKeyspaceError`\r\n\r\n## 1. Connection pool logic correctness\r\n\r\nThe logic is sound. The key insight of commit 2 (reordering) is correct and important:\r\n\r\n- Previously, a connection needing keyspace setup would run `maybe_reshard(sharder)` **before** its setup finished. If the node had resharded, this would **clear the existing healthy pool** (`maybe_reshard` calls `self.conns.clear()` at connection_pool.rs:1110), and then if keyspace setup failed, the pool would be left empty. The reorder defers all sharding side-effects until the connection is fully ready.\r\n- `evt.requested_shard` and `evt.keyspace_name` are correctly threaded through `start_setting_keyspace_for_connection`, so the advanced-shard-awareness mismatch check still runs (just deferred to when the connection comes back ready). No information is lost.\r\n- The single-actor model (all `&mut self` on one task) means the `!self.is_filling() && self.is_empty()` guard and the `is_empty()` re-check inside `update_shared_conns` are race-free.\r\n\r\nOne design note (not a bug): a transient `UseKeyspaceError::RequestTimeout` now discards an otherwise-healthy TCP connection rather than retrying the `USE` on it. That's safe and simpler, but slightly wasteful. Worth a one-line comment acknowledging the choice.\r\n\r\n## 2. Metrics inc/dec correctness — the subtle part, done right\r\n\r\nThe asymmetry between the two error arms is **correct and non-obvious**:\r\n\r\n- `count_in_metrics` only calls `inc_total_connections()` on a **successful** open (connection_pool.rs:1046). A failed *connect* was never counted, so the `Connection` error arm correctly does **not** decrement.\r\n- A keyspace failure happens on a connection that already opened successfully (already inc'd), so the new `dec_total_connections()` at connection_pool.rs:898 correctly rebalances.\r\n- On the `Err(Keyspace)` path, the `connection`/`error_receiver` are dropped inside the async task's `.map(|()| (connection, error_receiver))` closure (never added to `conns`/`excess_connections`), so `remove_connection` won't double-decrement. Balanced.\r\n\r\n`dec_total_connections` is a raw `fetch_sub` (would wrap on underflow), but every dec here is paired with a prior inc, so no underflow in practice — consistent with the existing `remove_connection` usage.\r\n\r\n## 3. Error handling — uniform where it should be\r\n\r\nThe keyspace arm mirrors the non-shard-aware connection arm (`had_error_since_last_refill = true`; `if !is_filling && is_empty → update_shared_conns(Some(err.into()))`). The differences are all justified:\r\n\r\n- **No shard-aware fallback** in the keyspace arm even when `requested_shard.is_some()` — correct, since the connection itself succeeded (the shard-aware port works); only the keyspace `USE` failed.\r\n- **Sets `had_error_since_last_refill` unconditionally**, unlike the shard-aware *connect* failure which deliberately skips it — correct, a keyspace failure is a genuine error that would recur on the regular port too.\r\n\r\nMinor nits:\r\n- Log level inconsistency: keyspace arm uses `warn!`, the connection arm uses `debug!`. Defensible, but worth aligning intentionally.\r\n- The new `ConnectionError::UseKeyspaceError` is a **new public enum variant**, so the checklist item \"No public items were introduced\" is technically inaccurate. It's non-breaking (`ConnectionError` is `#[non_exhaustive]`), and semantically fits (\"connection can no longer be used and should be dropped\"). Just flag it as a public-API addition.\r\n\r\n## 4. Tests — correct, readable, non-flaky, but one coverage gap\r\n\r\nBoth tests are correct and non-flaky:\r\n\r\n- **`keyspace_setup_failure_triggers_refill`** (unit): verifies `had_error`, empty `ready_connections` (i.e. **no** shard-aware fallback was started), `is_empty`, `need_filling`, `Broken(UseKeyspaceError::RequestTimeout)`, `pool_updated` notified, and metrics decremented to 0. Good, self-contained, no timing.\r\n- **`keyspace_setup_failure_preserves_pool_state`** (proxy): the important regression test for commit 2. `change_request_rules` writes under a `Mutex` synchronously (proxy.rs:413), and the second `open_connection` starts *after* it, so the new connection **deterministically** reports 2 shards — the test genuinely exercises the reshard-deferral. It asserts the pool is *not* resharded/cleared before setup completes and is *preserved* after the failure. No sleeps; `ready_connections.next().await` resolves off the proxy's `server_error` response. Non-flaky. `connection_errors` is never polled, so the kept connection can't be spuriously removed.\r\n\r\nGaps / suggestions:\r\n- **No unit test for the success path after the reorder** (keyspace set OK → connection added, pool resharded correctly). The happy path is covered by `scylla/tests/integration/session/use_keyspace.rs`, but a focused unit test would round out coverage of the reordered branch and guard against future regressions.\r\n- In test 1, `requested_shard: Some(...)` is used specifically to prove no shard-aware fallback fires on keyspace failure — good — but a short comment would make that intent explicit to readers.\r\n\r\n## Verdict\r\n\r\nThe change is correct, the tricky bits (metrics balance and the reorder-before-reshard) are handled properly, and tests are deterministic. I'd recommend only minor follow-ups: align the log level, correct the \"no public items\" checklist claim (or note the non-breaking variant), and consider adding a success-path unit test for the reordered branch.\r\n\r\n\r\n\u003c/p>\r\n\u003c/details> "},{"user":"coderabbitai[bot]","state":"COMMENTED","body":"**Actionable comments posted: 1**\n\n\u003cdetails>\n\u003csummary>🤖 Prompt for all review comments with AI agents\u003c/summary>\n\n```\nVerify each finding against current code. Fix only still-valid issues, skip the\nrest with a brief reason, keep changes minimal, and validate.\n\nInline comments:\nIn `@scylla/src/network/connection_pool.rs`:\n- Around line 1639-1677: Update maybe_reshard and both\nexcess_connections.clear() paths to call metrics.dec_total_connections() once\nfor every connection discarded, keeping the total-connection metric aligned with\nthe pool count. After the final reshard in this test, assert\nmetrics.get_total_connections() matches the remaining connection count.\n```\n\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>🪄 Autofix (Beta)\u003c/summary>\n\nFix all unresolved CodeRabbit comments on this PR:\n\n- [ ] \u003c!-- {\"checkboxId\": \"4b0d0e0a-96d7-4f10-b296-3a18ea78f0b9\"} --> Push a commit to this branch (recommended)\n- [ ] \u003c!-- {\"checkboxId\": \"ff5b1114-7d8c-49e6-8ac1-43f82af23a33\"} --> Create a new PR with the fixes\n\n\u003c/details>\n\n---\n\n\u003cdetails>\n\u003csummary>ℹ️ Review info\u003c/summary>\n\n\u003cdetails>\n\u003csummary>⚙️ Run configuration\u003c/summary>\n\n**Configuration used**: Organization UI\n\n**Review profile**: CHILL\n\n**Plan**: Pro Plus\n\n**Run ID**: `3093e064-ae18-40ea-9349-29f867f0c74e`\n\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>📥 Commits\u003c/summary>\n\nReviewing files that changed from the base of the PR and between 27ed7d10b3c3b78be58892ee59378a0ff4f2df4f and 00380d399b84cc58cae21518cf33c575c820e6d7.\n\n\u003c/details>\n\n\u003cdetails>\n\u003csummary>📒 Files selected for processing (1)\u003c/summary>\n\n* `scylla/src/network/connection_pool.rs`\n\n\u003c/details>\n\n\u003c/details>\n\n\u003c!-- This is an auto-generated comment by CodeRabbit for review status -->"},{"user":"wprzytula","state":"COMMENTED","body":""},{"user":"wprzytula","state":"COMMENTED","body":""},{"user":"wprzytula","state":"CHANGES_REQUESTED","body":"The commit history is tangled, while this PR really consists of two parts:\n1. Bug fix for connection metrics imbalance. This solves a pre-existing bug.\n2. Behaviour change: discarding connection upon keyspace setup failure.\n\nCould you rewrite the code to consist of these two commits? Right now it's hard to review:\n- in \"all changes\" view, both parts are mixed together;\n- per-commit view is even worse with current commits."},{"user":"wprzytula","state":"COMMENTED","body":"Thank you for the commit rewrite! Now it was very clean to read.\r\n\r\nI think we're still missing a (regression) test for the bug fix in the first commit. Could you trigger/mock the scenario that was fixed to make sure the metrics imbalance is gone?\r\n\r\nIf you decide to write it, I encourage you to first share your test idea, then we'll discuss it, only then let's jump into implementation."},{"user":"wprzytula","state":"CHANGES_REQUESTED","body":"One last request from me: please put the metrics balance test's commit before the commit that changes the logic wrt discarding connections after keyspace setup failure. This way we will be sure that the test passes with both the old logic and with the new logic. "},{"user":"wprzytula","state":"APPROVED","body":""},{"user":"Guflly","state":"COMMENTED","body":""},{"user":"Lorak-mmk","state":"COMMENTED","body":""},{"user":"Lorak-mmk","state":"COMMENTED","body":""},{"user":"Lorak-mmk","state":"COMMENTED","body":""},{"user":"Lorak-mmk","state":"APPROVED","body":""},{"user":"Lorak-mmk","state":"APPROVED","body":""}]},"author":"Guflly"}},{"id":"ironweave","language":"C++","title":"rpc: refuse to send on a stream connection once stream_close() has begun","fork":"dkropachev/ironweave","pr":1,"prUrl":"https://github.com/dkropachev/ironweave/pull/1","upstreamUrl":"https://github.com/scylladb/seastar/pull/3664","diffBytes":15931,"commits":3,"preparedAt":"2026-09-20T17:11:37.492Z","runIds":["ironweave/anthropic-pr-review","ironweave/builtin-code-review","ironweave/ce-code-review","ironweave/mattpocock-review","ironweave/superpowers-review","ironweave/tob-c-review","ironweave/tob-diff-review"],"groundtruth":{"upstream":"scylladb/seastar","pr":3664,"title":"rpc: refuse to send on a stream connection once stream_close() has begun","url":"https://github.com/scylladb/seastar/pull/3664","merged":"2026-09-03T16:13:51Z","base":"9db0f30e37f2fec72ca3099573464205804e88d2","head":"0b483ae26c68668e7ef60bfb4bea4664c7fb3da6","diffBytes":15948,"review":{"inline":[{"user":"michoecho","path":"src/rpc/rpc.cc","line":293,"body":"It seems to me that it doesn't remove the race, only makes the race window more narrow.\r\n\r\nWhat if we pass through the `!_stream_closing` check and suspend at `_outgoing_queue_ready`, and `stream_close()` only runs at this moment? Won't we still try to write to the closed stream after we resume?\r\n"},{"user":"michoecho","path":"tests/unit/rpc_test.cc","line":1867,"body":"> exactly as a dictionary announcement would\n\nNit: this remark is Scylla-specific. It's not appropriate here."},{"user":"michoecho","path":"tests/unit/rpc_test.cc","line":2015,"body":"Too Scylla-specific."},{"user":"michoecho","path":"tests/unit/rpc_test.cc","line":1867,"body":"> Backport: needed on every live Scylla version with advanced RPC compression: 2025.1, 2026.1, 2026.2, 2026.3.\r\n\r\nAlso applies to this."},{"user":"bhalevy","path":"src/rpc/rpc.cc","line":293,"body":"You're right, thanks. The flag alone only stops new send() calls; an entry accepted just before it could still be queued behind _outgoing_queue_ready and be written after the close. Fixed by having stream_close() wait for the queue to drain before it closes the write buffer: it chains a barrier on _outgoing_queue_ready the way send() does, so the close runs only once every accepted entry has been written and flushed into the batch it covers. Setting _error early instead doesn't work: stop() would then skip the shutdown_input() that wakes the receive loop (abort() is a no-op once _error is set), and if stream_close() called abort() itself, stop_send_loop() would shutdown_output() before the eof marker written by this very close is flushed."},{"user":"bhalevy","path":"tests/unit/rpc_test.cc","line":1867,"body":"Removed, along with the backport line in the cover letter."},{"user":"bhalevy","path":"tests/unit/rpc_test.cc","line":2015,"body":"Removed."},{"user":"gleb-cloudius","path":"doc/rpc-streaming.md","line":112,"body":"Claude loves to push implementation details everywhere. Not sure such details are appropriate for this doc."},{"user":"xemul","path":"src/rpc/rpc.cc","line":562,"body":"Why is `drained` needed? It looks like `std::exchange(_outgoing_queue_ready, make_ready_future\u003c>())` would work just as good"},{"user":"xemul","path":"include/seastar/rpc/rpc.hh","line":307,"body":"It looks like `_stream_closing == _sink_closed || _source_closed` , is one more boolean really needed?"},{"user":"bhalevy","path":"src/rpc/rpc.cc","line":562,"body":"AFAIU, `stop_send_loop` waits for `_outgoing_queue_ready` before calling `_connected->write_buf.close()`, so it wants it drained.\r\n"},{"user":"bhalevy","path":"src/rpc/rpc.cc","line":562,"body":"You're right, the barrier isn't needed: send() is refused once the flag is set, and stop_send_loop() is held by _sink_closed_future until this close completes, so nothing else waits for _outgoing_queue_ready from here on. Replaced with a ready future."},{"user":"bhalevy","path":"include/seastar/rpc/rpc.hh","line":307,"body":"Not quite: both default to true and only become false when a sink_impl or source_impl is created on the connection, so that expression is true on every stream connection between negotiation and the application creating its handles, and always true on the server side of a one-directional stream, which never has a sink. Refusing send() there would break the compressor's control frames on those connections. The flag marks one thing only: stream_close() has started closing the write buffer."},{"user":"bhalevy","path":"doc/rpc-streaming.md","line":112,"body":"Trimmed to the contract itself, in the doc and in the sink/source doc comments."},{"user":"xemul","path":"src/rpc/rpc.cc","line":562,"body":"The _connection->write_buf.close() happens in this code after queue is drained and stop_send_loop does\r\n\r\n```\r\nreturn when_all(std::move(_outgoing_queue_ready), std::move(_sink_closed_future)).then([] {\r\n    ... // calls _connection->write_buf.close() if it wasn't closed in stream_close()\r\n});\r\n```"},{"user":"xemul","path":"include/seastar/rpc/rpc.hh","line":307,"body":":exploding_head: It looks like you're right"}],"issue":[{"user":"bhalevy","body":"Changes since the first push, from @michoecho's review:\n\n- **Fix commit:** `stream_close()` now also drains `_outgoing_queue` before closing the write buffer. Setting `_stream_closing` only stops new `send()` calls; an entry `send()` accepted just before the mark could still be queued behind `_outgoing_queue_ready` and would be written into the closed buffer afterwards. `stream_close()` therefore chains on `_outgoing_queue_ready` the way `send()` does, and closes the buffer only once that resolves, i.e. once the last accepted entry has been written and flushed into the batch the close then covers. The commit message explains why setting `_error` early instead does not work.\n- **Test commit:** dropped the Scylla-specific remarks from the comments.\n- **Cover letter:** dropped the backport line; the targets live in the tracking ticket.\n\nVerification, `build/debug` (ASan, UBSan, vptr): full `rpc_test` passes on 1 and 2 shards; the new test passes 3/3 on 2 shards.\n"},{"user":"michoecho","body":"One more thing:\r\n\r\n> Refs https://scylladb.atlassian.net/browse/CUSTOMER-666\r\n> Refs https://scylladb.atlassian.net/browse/CUSTOMER-678\r\n> Refs https://scylladb.atlassian.net/browse/SCYLLADB-4034\r\n\r\nThat's also Scylla-specific. Unless it changed, the usual convention was to put such links on the Scylla PR which updates the Seastar submodule."},{"user":"bhalevy","body":"> One more thing:\r\n> \r\n> > Refs [scylladb.atlassian.net/browse/CUSTOMER-666](https://scylladb.atlassian.net/browse/CUSTOMER-666)\r\n> > Refs [scylladb.atlassian.net/browse/CUSTOMER-678](https://scylladb.atlassian.net/browse/CUSTOMER-678)\r\n> > Refs [scylladb.atlassian.net/browse/SCYLLADB-4034](https://scylladb.atlassian.net/browse/SCYLLADB-4034)\r\n> \r\n> That's also Scylla-specific. Unless it changed, the usual convention was to put such links on the Scylla PR which updates the Seastar submodule.\r\n\r\nI wish the integration of seastar and Jira would work better.\r\nI added those references to help track the seastar changes and make sure the Jira tickets are updated (manually) as the seastar fix reaches the right branches and the seastar submodule is updated in the respective scylla branches."},{"user":"bhalevy","body":"Changes since the previous push, from review:\n\n- **Fix commit:** dropped the barrier promise in `stream_close()`. `_outgoing_queue_ready` is simply exchanged for a ready future and the old one is waited for before the write buffer is closed; nothing else waits for it from there on, since `send()` is refused and `stop_send_loop()` is held by `_sink_closed_future`. Comment and commit message reworded to match.\n- **Doc commit:** trimmed \"Closing a stream\" and the `rpc::sink`/`rpc::source` doc comments to the contract itself, without implementation details.\n\nVerification, `build/debug` (ASan, UBSan, vptr): `test_stream_send_after_stream_close` passes; full `rpc_test` passes on 2 shards.\n"},{"user":"bhalevy","body":"@xemul can you please create scylla-seastar/branch-2026.3 and backport this fix to scylla-seastar/branch-2026.{2,1} and 2025.1?"},{"user":"mykaul","body":"@bhalevy - https://github.com/scylladb/seastar/pull/3669 failed CI on test_stream_send_after_stream_close in tests/unit/rpc_test.cc . I think it has nothing to do with RPC, just exposes flakiness in the new test."},{"user":"bhalevy","body":"https://github.com/scylladb/seastar/pull/3670 fixes flakiness in `test_stream_send_after_stream_close` that was added here."}],"reviews":[{"user":"michoecho","state":"CHANGES_REQUESTED","body":""},{"user":"michoecho","state":"COMMENTED","body":""},{"user":"bhalevy","state":"COMMENTED","body":""},{"user":"bhalevy","state":"COMMENTED","body":""},{"user":"bhalevy","state":"COMMENTED","body":""},{"user":"michoecho","state":"APPROVED","body":"The revised version looks okay to me.\r\n\r\nCan't say it's making the synchronization rules of `connection` any easier to comprehend, though.\r\n\r\n(Aside: this `_outgoing_queue` dance, for example, seems to be begging for some queue abstraction, in which you could call `enqueue` and `drain`, instead of the manual promise juggling. Not in this patch, though)."},{"user":"gleb-cloudius","state":"COMMENTED","body":""},{"user":"gleb-cloudius","state":"APPROVED","body":""},{"user":"xemul","state":"COMMENTED","body":""},{"user":"xemul","state":"COMMENTED","body":""},{"user":"bhalevy","state":"COMMENTED","body":""},{"user":"bhalevy","state":"COMMENTED","body":""},{"user":"bhalevy","state":"COMMENTED","body":""},{"user":"bhalevy","state":"COMMENTED","body":""},{"user":"xemul","state":"COMMENTED","body":""},{"user":"xemul","state":"COMMENTED","body":""},{"user":"xemul","state":"APPROVED","body":""}]},"author":"bhalevy"}}],"tools":[{"id":"builtin-code-review","label":"Claude Code /code-review","source":"built-in","languages":null,"parked":false,"parkedReason":null,"catalogId":"builtin-code-review","catalogLabel":"Claude Code /code-review","description":"A multi-agent pull-request review that checks repository guidance, the changed code, and git history, then filters findings by confidence.","install":"Included with Claude Code; no separate install is required.","invoke":"/code-review","repoUrl":"https://github.com/anthropics/claude-code","pageUrl":"https://github.com/anthropics/claude-code/tree/main/plugins/code-review"},{"id":"ce-code-review","label":"Compound Engineering ce-code-review","source":"compound-engineering@compound-engineering-plugin","languages":null,"parked":false,"parkedReason":null,"catalogId":"ce-code-review","catalogLabel":"Compound Engineering ce-code-review","description":"A report-only review that selects specialist reviewer perspectives for the diff, then merges and deduplicates their findings.","install":"/plugin marketplace add EveryInc/compound-engineering-plugin\n/plugin install compound-engineering","invoke":"/ce-code-review","repoUrl":"https://github.com/EveryInc/compound-engineering-plugin","pageUrl":"https://github.com/EveryInc/compound-engineering-plugin/blob/main/docs/guides/ce-code-review.md"},{"id":"tob-diff-review","label":"Trail of Bits differential-review","source":"differential-review@trailofbits","languages":null,"parked":false,"parkedReason":null,"catalogId":"tob-diff-review","catalogLabel":"Trail of Bits differential-review","description":"A security-focused review of a commit or pull-request diff with git-history and blast-radius analysis.","install":"/plugin marketplace add trailofbits/skills\n/plugin install differential-review@trailofbits","invoke":"/differential-review:diff-review \u003cPR URL>","repoUrl":"https://github.com/trailofbits/skills","pageUrl":"https://github.com/trailofbits/skills/tree/main/plugins/differential-review"},{"id":"tob-rust-review","label":"Trail of Bits rust-review","source":"rust-review@trailofbits","languages":["Rust"],"parked":false,"parkedReason":null,"catalogId":"tob-rust-review","catalogLabel":"Trail of Bits rust-review","description":"A comprehensive Rust security review covering unsafe boundaries, memory safety, concurrency, panic denial-of-service, FFI, and async code.","install":"/plugin marketplace add trailofbits/skills\n/plugin install rust-review@trailofbits","invoke":"/rust-review:rust-review","repoUrl":"https://github.com/trailofbits/skills","pageUrl":"https://github.com/trailofbits/skills/tree/main/plugins/rust-review"},{"id":"tob-c-review","label":"Trail of Bits c-review","source":"c-review@trailofbits","languages":["C++"],"parked":true,"parkedReason":"Its fan-out Workflow needs more tokens than one usage window holds, so every attempt was cut mid-workflow and none produced a report: 28 attempts, 184.9M tokens, $186 in that one cell. Kept in the matrix and in the report as a did-not-finish; the runner skips it unless --include-parked is passed.","catalogId":"tob-c-review","catalogLabel":"Trail of Bits c-review","description":"A comprehensive C and C++ security review with source-parsed coverage checks, false-positive judging, and SARIF output.","install":"/plugin marketplace add trailofbits/skills\n/plugin install c-review@trailofbits","invoke":"/c-review:c-review","repoUrl":"https://github.com/trailofbits/skills","pageUrl":"https://github.com/trailofbits/skills/tree/main/plugins/c-review"},{"id":"anthropic-pr-review","label":"Anthropic pr-review-toolkit","source":"pr-review-toolkit@claude-plugins-official","languages":null,"parked":false,"parkedReason":null,"catalogId":"anthropic-pr-review","catalogLabel":"Anthropic pr-review-toolkit","description":"Anthropic’s pull-request toolkit, with specialized reviewers for comments, tests, error handling, type design, code quality, and simplification.","install":"/plugin install pr-review-toolkit@claude-plugins-official","invoke":"/pr-review-toolkit:review-pr all","repoUrl":"https://github.com/anthropics/claude-plugins-official","pageUrl":"https://github.com/anthropics/claude-plugins-official/tree/main/plugins/pr-review-toolkit"},{"id":"superpowers-review","label":"Superpowers requesting-code-review","source":"superpowers@superpowers-dev","languages":null,"parked":false,"parkedReason":null,"catalogId":"superpowers-review","catalogLabel":"Superpowers requesting-code-review","description":"A workflow that sends a precise requirements-and-diff package to a fresh code-reviewer subagent before work is merged.","install":"/plugin install superpowers@claude-plugins-official","invoke":"Ask the agent to use requesting-code-review.","repoUrl":"https://github.com/obra/superpowers","pageUrl":"https://github.com/obra/superpowers/blob/main/skills/requesting-code-review/SKILL.md"},{"id":"mattpocock-review","label":"Matt Pocock code-review","source":"mattpocock-skills@mattpocock","languages":null,"parked":false,"parkedReason":null,"catalogId":"mattpocock-review","catalogLabel":"Matt Pocock code-review","description":"A two-axis diff review: implementation correctness plus repository standards and a compact code-smell baseline.","install":"/plugin install mattpocock-skills\n/setup-matt-pocock-skills","invoke":"/code-review main","repoUrl":"https://github.com/mattpocock/skills","pageUrl":"https://github.com/mattpocock/skills/blob/main/docs/engineering/code-review.md"}],"issues":[{"id":"I1","title":"Zero/negative inner-vector dimension floors elemMin at 1, leaving 24x amplification","file":"marshal.go","line":1134,"kind":"security","severity":"high","verdict":"real","verdictReason":"vectorElemMinSize's nested clause is gated on vec.Dimensions > 0, so vector\u003cvector\u003cfloat,0>,N> falls to the `size \u003c 1 -> return 1` fallback at marshal.go:1141; I ran it: a 1 MiB payload with N=1\u003c\u003c20 passes the bound and reflect.MakeSlice at marshal.go:1083 allocates 25,175,696 bytes (24.0x) before the inner decoder errors.","introducedByPr":false,"scope":"in-scope","scopeReason":"The amplification is identical on main (25.0x measured), but vectorElemMinSize is new code the PR added precisely to bound nested vectors, so the gap belongs in this PR.","reportedBy":["anthropic-pr-review","mattpocock-review","ce-code-review"],"reportedAs":{"anthropic-pr-review":"vectorElemMinSize returns 1 whenever an inner vector's Dimensions \u003c= 0 ... a peer can pick that number to produce a 1 MB payload that allocates 26 MB, reopening the exact DoS the bound was written to close.","mattpocock-review":"vectorElemMinSize only adds the nested vector's size when vec.Dimensions > 0 and otherwise floors at 1 ... confirmed empirically at 24.0x amplification (25,175,696 bytes for a 1 MiB payload), defeating the PR's headline claim.","ce-code-review":"No test covers vector\u003cvector\u003cfloat,0>,N>, the shape reaching the 'return 1' fallback; TestVectorElemMinSize pins the floor value but nothing pins what unmarshalVector then allocates for it."},"targetId":"tidepool"},{"id":"I2","title":"Bound counts wire bytes but allocation is Go-sized, so 16x amplification survives","file":"marshal.go","line":999,"kind":"security","severity":"high","verdict":"real","verdictReason":"The bound divides len(data) by a wire-byte floor, but reflect.MakeSlice at marshal.go:1083 allocates info.Dimensions Go elements; I ran vector\u003ctext,1\u003c\u003c20> over a 1 MiB payload of zero vints into *[]string — it allocated 16,782,904 bytes (16.0x) and returned a nil error.","introducedByPr":false,"scope":"in-scope","scopeReason":"Pre-existing on main, but the PR's stated purpose is to make this allocation bounded and it is the code that introduced the byte-count model.","reportedBy":["ce-code-review","superpowers-review"],"reportedAs":{"ce-code-review":"The bound compares Dimensions against len(data)/elemMin (wire bytes) while reflect.MakeSlice allocates using the Go element size, so a peer can still trigger allocation far larger than the payload (e.g. ~4GiB from a 256MiB body for vector\u003ctext,N>).","superpowers-review":"Variable-length allocation amplification under the floor-of-1 is set aside as explicitly deferred or pre-existing and was not investigated in this review."},"targetId":"tidepool"},{"id":"I3","title":"Zero VectorType into an empty-interface destination still nil-derefs in VectorType.Zero()","file":"marshal.go","line":1044,"kind":"bug","severity":"high","verdict":"real","verdictReason":"The dim-0 carve-out at marshal.go:998 keeps the bound from touching SubType, but marshal.go:1044 then calls info.Zero(), which dereferences v.SubType at marshal.go:2046; I ran `var dst any; unmarshalVector(VectorType{}, []byte{}, &dst)` on both HEAD and main and both panic with a nil pointer dereference.","introducedByPr":false,"scope":"in-scope","scopeReason":"Pre-existing, but the PR's new guard comment and TestUnmarshalVectorZeroDimensionsDoesNotTouchSubType advertise this exact protection while only pinning the *[]float64 destination.","reportedBy":["builtin-code-review","anthropic-pr-review"],"reportedAs":{"builtin-code-review":"The new Dimensions > 0 guard prevents the bound check from dereferencing a nil SubType, but info.Zero() (via marshal.go:2046, v.SubType.NewWithError()) still panics; `var dst any; Unmarshal(VectorType{}, []byte{}, &dst)` panics with a nil-pointer dereference, verified by running it.","anthropic-pr-review":"The comment says the dim-0 carve-out exists so a caller-supplied zero VectorType cannot panic on the Scan goroutine, but the table only uses `var dst []float64`, which never touches SubType; with `var dst any` both rows still panic."},"targetId":"tidepool"},{"id":"I4","title":"vectorElemMinSize(nil) panics when Dimensions > 0 despite the guard's nil-SubType claim","file":"marshal.go","line":999,"kind":"bug","severity":"low","verdict":"real","verdictReason":"vectorElemMinSize calls vectorFixedElemSize(elemType), which calls elemType.Type() on the nil interface; VectorType{Dimensions: 3, SubType: nil} with non-nil data reaches it. On main the fast-path switch did info.SubType.Type() behind the identical guard, so it is exact parity, not a regression.","introducedByPr":false,"scope":"in-scope","scopeReason":"The PR's own comment at marshal.go:995-997 reasons about caller-supplied nil SubTypes, so the incomplete invariant belongs with the code that states it.","reportedBy":["tob-diff-review","ce-code-review","superpowers-review"],"reportedAs":{"tob-diff-review":"unmarshalVector(VectorType{Dimensions: 3}, make([]byte,12), &dst) still nil-derefs in vectorFixedElemSize; the guard adds a second, earlier copy of the dereference under a comment that reads as if it were handled.","ce-code-review":"With Dimensions > 0 and non-nil data, a caller-constructed VectorType with a nil SubType reaches vectorFixedElemSize(nil) and panics calling Type() on a nil interface; pre-existing.","superpowers-review":"vectorElemMinSize nil-derefs on a nil SubType when Dimensions>0; not a regression (exact parity with the old fast path) and unreachable from the wire."},"targetId":"tidepool"},{"id":"I5","title":"Nested vector inner type keeps the bare VectorType prefix, so the new error names nothing","file":"helpers.go","line":271,"kind":"bug","severity":"medium","verdict":"real","verdictReason":"helpers.go:271 builds the VectorType's NativeType from prefix+\"VectorType\" rather than the parsed `name`; I ran Unmarshal of a wire-parsed vector\u003cvector\u003cfloat,3>,2> into *any and got exactly `unmarshal vector: no Go type for element type custom(org.apache.cassandra.db.marshal.VectorType)` — no element type, no dimension.","introducedByPr":false,"scope":"in-scope","scopeReason":"The PR's stated goal for the sibling branch is that the error say what the server sent, and the same one-line fix in the function it edits would deliver it here.","reportedBy":["anthropic-pr-review","builtin-code-review","ce-code-review","mattpocock-review","tob-diff-review","superpowers-review"],"reportedAs":{"anthropic-pr-review":"NewCustomType(protoVer, TypeCustom, prefix+\"VectorType\") stores the bare prefix, so the PR's new error for a nested vector reads with no element type or dimension; storing `name` there instead would fix both the message and nested-vector decoding into interface{}.","builtin-code-review":"This branch still stores prefix+\"VectorType\" without the parenthesized subtype, so asVectorType cannot parse it, NewWithError fails, Zero() returns nil, and a nested-vector column errors out of MapScan/Scan(&any) with an unhelpful message.","ce-code-review":"For a nested vector, the new guard prints the bare prefix 'no Go type for element type custom(...)' because getCassandraLongType builds the nested VectorType's NativeType from a constant prefix rather than the parsed spec.","mattpocock-review":"helpers.go:280-284 only fixes the unknown-basic-type case; the inner VectorType still carries the bare custom name and has no String(), so the nested-vector error path prints 'no Go type for element type custom(...VectorType)' without element type or dimensions.","tob-diff-review":"For the nested-vector case, the message still reports custom(org.apache.cassandra.db.marshal.VectorType) with no element type or dimensions, because the inner type is built with prefix+\"VectorType\" rather than name.","superpowers-review":"VectorType has no String(), so %v falls through to the promoted NativeType.String() and the error reads 'no Go type for element type custom(...VectorType)' with no ls vectorElemMinSize(info.SubType) unconditionally ahead of the float fast paths and recomputes it every row uncached; benchmarks show head and base indistinguishable within noise."},"targetId":"tidepool"},{"id":"I38","title":"Deferred #1106: oversized vint element length narrows to -1, decoding empty with nil error","file":"marshal.go","line":1097,"kind":"bug","severity":"medium","verdict":"real","verdictReason":"marshal.go:1097 does elemSize = int(m) from readUnsignedVInt, and the `elemSize >= 0` guard at marshal.go:1104 then skips consuming any bytes when the conversion goes negative, leaving unmarshalData nil and the element decoding as empty with a nil error.","introducedByPr":false,"scope":"out-of-scope","scopeReason":"Pre-existing and explicitly deferred by the PR description; the new bound does not make it reachable or worse.","reportedBy":["ce-code-review","anthropic-pr-review","superpowers-review"],"reportedAs":{"ce-code-review":"With the one-byte floor letting variable-length vectors through, a max-width VInt element length converts via int(m) to -1, so no payload bytes are consumed and the element silently decodes as an empty string with a nil error.","anthropic-pr-review":"vint length narrowing to negative makes vector\u003ctext,1> decode [\"\"] with nil error; reachable as described but correctly scoped out of this PR.","superpowers-review":"The vint-narrowing-to-negative path (#1106) is set aside as explicitly deferred or pre-existing."},"targetId":"tidepool"},{"id":"I39","title":"Deferred #1086: surplus trailing bytes dropped on the generic path, rejected on fast paths","file":"marshal.go","line":1095,"kind":"bug","severity":"low","verdict":"real","verdictReason":"The generic loop at marshal.go:1095-1116 consumes exactly Dimensions elements and never checks for leftover data, while the float fast paths at marshal.go:1012 and 1027 require len(data) == expected; the PR's own test 'payload with a trailing byte' pins the asymmetry.","introducedByPr":false,"scope":"out-of-scope","scopeReason":"Pre-existing and explicitly deferred by the PR description.","reportedBy":["anthropic-pr-review","ce-code-review","superpowers-review"],"reportedAs":{"anthropic-pr-review":"surplus trailing bytes silently dropped in the generic path while fast paths reject them; reachable as described but correctly scoped out of this PR.","ce-code-review":"Surplus trailing bytes in a generic (non-float-fast-path) vector payload are still accepted rather than rejected, unlike the float fast paths which reject the same malformed payload.","superpowers-review":"Trailing-byte distribution (#1086) is set aside as explicitly deferred or pre-existing."},"targetId":"tidepool"},{"id":"I40","title":"Peer-controlled type descriptor text reaches error messages verbatim","file":"marshal.go","line":1048,"kind":"security","severity":"low","verdict":"real","verdictReason":"The new error at marshal.go:1048 formats info.SubType with %v, and NativeType.String prints the raw custom name the server sent; the PR's getCassandraLongType change at helpers.go:283 widens which names reach it. A wire custom name can be up to 65535 bytes including newlines, and applications routinely log these errors.","introducedByPr":true,"scope":"in-scope","scopeReason":"The PR added both the message and the change that preserves the raw server-supplied name in it.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"The new error at marshal.go:1048 formats the peer's type descriptor with %v, and NativeType.String prints the raw custom name the server sent verbatim, up to 65535 bytes including newlines/escape sequences, reaching an error applications routinely log; not filed since the driver already prints info this way elsewhere."},"targetId":"tidepool"},{"id":"I41","title":"No test pins the headline change: an empty non-NULL payload for vector\u003cint,3>","file":"marshal_vector_test.go","line":641,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"The nearest rows in TestUnmarshalVectorRejectsUnfittableDimensions use a 2-byte payload (marshal_vector_test.go:640,648), and TestUnmarshalVectorZeroDimensionsDoesNotTouchSubType uses Dimensions == 0; the exact case the description leads with — vector\u003cint,3> over []byte{} — is untested.","introducedByPr":true,"scope":"in-scope","scopeReason":"The behaviour change is this PR's headline and the tests are new.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"No test pins that unmarshalVector(vector\u003cint,3>, []byte{}, &dst) changed from nil error with a zero-filled slice on base to an explicit 'do not fit' error on head; existing tests use a 2-byte payload or Dimensions==0."},"targetId":"tidepool"},{"id":"I42","title":"No test covers a variable-length element whose real minimum exceeds the 1-byte floor","file":"marshal_vector_test.go","line":693,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"TestUnmarshalVectorAcceptsWellFormedPayloads uses only float, text and nested shapes; nothing exercises vector\u003csmallint,N> or vector\u003cduration,N>, whose real wire minimum is 3 bytes and more, to confirm the floor stays permissive for a well-formed server payload.","introducedByPr":true,"scope":"in-scope","scopeReason":"The bound and its acceptance tests are new in this PR.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"No test uses vector\u003csmallint,N> or vector\u003cduration,N> to confirm the bound stays permissive enough to accept a real, well-formed server payload for such types."},"targetId":"tidepool"},{"id":"I43","title":"No test asserts the float fast-path message survives for longer-than-minimum payloads","file":"marshal_vector_test.go","line":693,"kind":"test-gap","severity":"nit","verdict":"real","verdictReason":"The description says the bound's message replaces the fast paths' exact byte count when it fires first, but no test pins the other side of that boundary — e.g. vector\u003cdouble,3> over 32 bytes still yielding \"expected 24 bytes, got 32\".","introducedByPr":true,"scope":"in-scope","scopeReason":"The message substitution is a behaviour change this PR documents.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"No test asserts that a vector\u003cdouble,3> payload of 32 bytes still produces 'expected 24 bytes, got 32' rather than the new bound's message, the boundary where the message substitution stops applying."},"targetId":"tidepool"},{"id":"I44","title":"No-Go-type test asserts only a message prefix, not the rendered type identifier","file":"marshal_vector_test.go","line":891,"kind":"test-gap","severity":"nit","verdict":"real","verdictReason":"The nested-vector subtest checks only strings.Contains(err, \"no Go type for element type\"), so the bare-prefix rendering documented in I5 passes unnoticed; the sibling unknown-type subtest does assert the name.","introducedByPr":true,"scope":"in-scope","scopeReason":"The test is new in this PR and its weak assertion hides I5.","reportedBy":["ce-code-review","mattpocock-review"],"reportedAs":{"ce-code-review":"TestUnmarshalVectorRejectsAnElementTypeWithNoGoType/nested_vector_into_an_interface asserts only that the error contains 'no Go type for element type', not what identifier follows, so a regression in the rendered identifier would go unnoticed.","mattpocock-review":"the new test only checks the message prefix so it doesn't catch this."},"targetId":"tidepool"},{"id":"I45","title":"No benchmark covers nested or variable-length vectors that now run the recursive prologue","file":"vector_bench_test.go","line":1,"kind":"test-gap","severity":"nit","verdict":"real","verdictReason":"vector_bench_test.go benchmarks only flat vector\u003cfloat,N>, so the recursive vectorElemMinSize call added at marshal.go:999 has no benchmark on the shapes where its cost is non-trivial (see I38).","introducedByPr":true,"scope":"in-scope","scopeReason":"The recursive prologue is new and its cost profile is unbenchmarked.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"There is no benchmark for a nested vector or a variable-length element vector, both of which now exercise the recursive prologue on every value."},"targetId":"tidepool"},{"id":"I46","title":"No test drives the bound through three or more levels of vector nesting","file":"marshal_vector_test.go","line":818,"kind":"test-gap","severity":"nit","verdict":"real","verdictReason":"TestVectorElemMinSize's deepest row is vector\u003cvector\u003cfloat,3>,4>; nothing exercises three-plus levels to confirm the recursion terminates with a sane floor. Minor — the wire type-name length already caps depth around 1500.","introducedByPr":true,"scope":"in-scope","scopeReason":"The recursion and its tests are new in this PR.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"No test confirms the recursion terminates with a sane floor for a type nested three-plus vector levels deep; described as minor since Dimensions is bounded before depth could matter in practice."},"targetId":"tidepool"},{"id":"I47","title":"Unmarshal's doc comment still has no vector row despite two new error conditions","file":"marshal.go","line":260,"kind":"docs","severity":"nit","verdict":"real","verdictReason":"The CQL-to-Go table in Unmarshal's doc comment has no vector entry and VectorType's own comment covers only Zero(), so the two error conditions this PR adds are undocumented for callers.","introducedByPr":false,"scope":"in-scope","scopeReason":"Pre-existing gap, but the PR adds two new caller-visible error conditions that would go in exactly that table.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"Unmarshal's doc comment has no 'vector' row in the CQL-to-Go table and VectorType's own comment covers only Zero(); this pre-existing gap now sits under two new error conditions the PR adds."},"targetId":"tidepool"},{"id":"I48","title":"getCassandraLongType's standing TODO for unit tests remains unaddressed","file":"helpers.go","line":204,"kind":"test-gap","severity":"nit","verdict":"real","verdictReason":"helpers.go:204 still reads `// TODO: Cover with unit tests.` directly above the function this PR edits, and no test file exercises getCassandraLongType directly.","introducedByPr":false,"scope":"in-scope","scopeReason":"Pre-existing, but the PR changes this function's output without adding the tests the TODO asks for.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"No test covers a List\u003cUnknownType>, an unknown map value, or a UDT field to confirm the widened Custom()/String() population behaves correctly for those positions."},"targetId":"tidepool"},{"id":"I50","title":"The \"not parallel\" comment's rationale is correct, not a misstatement of Go's scheduling","file":"marshal_vector_test.go","line":835,"kind":"docs","severity":"nit","verdict":"false-positive","verdictReason":"The comment reads \"Not parallel: TotalAlloc is the process's, and a parallel sibling would pollute it\" — i.e. it explains why t.Parallel() is omitted, which is accurate, since calling it would put the test in the concurrent batch. The separate, real concern about process-global TotalAlloc is captured in I26.","introducedByPr":true,"scope":"in-scope","scopeReason":"The comment is new in this PR, but the claimed error is a misreading.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"The comment's rationale is wrong because Go never runs a serial top-level test concurrently with parallel ones; the real exposure is leaked goroutines from earlier networked tests in the package."},"targetId":"tidepool"},{"id":"I51","title":"The info.Dimensions \u003c 0 check is covered by the PR's declared scope","file":"marshal.go","line":992,"kind":"design","severity":"nit","verdict":"false-positive","verdictReason":"The PR's first Scope-In bullet says Dimensions \"reaches make and reflect.MakeSlice unbounded\", and commit 0276a66's message names the negative-count MakeSlice panic explicitly; #1093 is about the metadata parsers, a different layer.","introducedByPr":true,"scope":"in-scope","scopeReason":"The check is new in this PR, but it is declared rather than scope creep.","reportedBy":["mattpocock-review"],"reportedAs":{"mattpocock-review":"The info.Dimensions \u003c 0 check at marshal.go:991 is not covered by any Scope-In bullet in the spec, which defers dim \u003c 1 handling to issue #1093; it's undeclared scope creep."},"targetId":"tidepool"},{"id":"I52","title":"CHANGELOG.md not updated, but the file does not exist in this fork","file":"","line":0,"kind":"docs","severity":"nit","verdict":"false-positive","verdictReason":"CONTRIBUTING.md:24 does ask for CHANGELOG.md updates, but `ls CHANGELOG.md` shows no such file in the repository, so the checklist item has already been retired here and no commit on main satisfies it either.","introducedByPr":false,"scope":"out-of-scope","scopeReason":"A stale CONTRIBUTING.md rule, not something this PR can satisfy.","reportedBy":["mattpocock-review","ce-code-review"],"reportedAs":{"mattpocock-review":"Both commits are bugfixes with user-visible behaviour change and neither touches a changelog, per CONTRIBUTING.md's checklist; however CHANGELOG.md doesn't exist in this fork.","ce-code-review":"The repository removed upstream's CHANGELOG.md and neither README.md nor CONTRIBUTING.md states a SemVer or breaking-change policy, so there's no channel through which this decode-behavior change reaches a consumer pinning a released tag."},"targetId":"tidepool"},{"id":"I53","title":"Commit subjects do not follow CONTRIBUTING.md's capitalized-subject + trailer format","file":"","line":0,"kind":"style","severity":"nit","verdict":"false-positive","verdictReason":"CONTRIBUTING.md does document that format, but `git log` shows every commit on main uses lowercase conventional-commit subjects with no Patch-by trailer, so these two commits match established repository practice.","introducedByPr":false,"scope":"out-of-scope","scopeReason":"The documented convention is already retired repo-wide.","reportedBy":["mattpocock-review"],"reportedAs":{"mattpocock-review":"CONTRIBUTING.md documents a capitalized short description plus a 'Patch by …; reviewed by …' trailer, but these commits use lowercase conventional-commit subjects with no such trailer; not a violation since every commit on main does the same."},"targetId":"tidepool"},{"id":"I1","title":"Pool-level USE failure leaves pooled connections on the old keyspace while pool believes otherwise","file":"scylla/src/network/connection_pool.rs","line":1287,"kind":"bug","severity":"high","verdict":"real","verdictReason":"PoolRefiller::use_keyspace (connection_pool.rs:1282-1325) sets self.current_keyspace optimistically before issuing any USE and never rolls it back or evicts a connection whose USE failed; Session::use_keyspace (session.rs:2007) and ClusterWorker (worker.rs:351) store it the same way. Already-pooled connections therefore keep serving the previous keyspace while the pool reports the new one, so unqualified statements silently hit the wrong keyspace.","introducedByPr":false,"scope":"out-of-scope","scopeReason":"The optimistic store and the missing per-connection retry predate the diff; the PR only closes this for newly opened connections.","reportedBy":["tob-diff-review"],"reportedAs":{"tob-diff-review":"current_keyspace is stored optimistically and never rolled back (also at worker.rs:351, connection_pool.rs:1287)."},"targetId":"quillstone"},{"id":"I2","title":"Permanently failing USE now drains every pool to Broken with no recovery path","file":"scylla/src/network/connection_pool.rs","line":900,"kind":"bug","severity":"high","verdict":"real","verdictReason":"current_keyspace is set unconditionally in use_keyspace (connection_pool.rs:1287) and never cleared, and the new Err(ConnectionSetupError::Keyspace) arm (connection_pool.rs:900-909) discards every connection whose USE fails. If the keyspace becomes permanently inaccessible, no connection can ever enter the pool: the pool empties, publishes MaybePoolConnections::Broken, and emit_events (connection_pool.rs:1158-1190) fires ConnectivityChangeEvent::Lost for every node, so even fully-qualified queries fail. Pre-PR the connection stayed usable and only a warning was logged.","introducedByPr":true,"scope":"in-scope","scopeReason":"The discard-on-USE-failure arm added by this PR is what converts a degraded-but-usable session into a fully-down cluster.","reportedBy":["anthropic-pr-review","superpowers-review","mattpocock-review","tob-diff-review","ce-code-review"],"reportedAs":{"anthropic-pr-review":"PoolRefiller::use_keyspace sets current_keyspace unconditionally and never clears it on a failed USE, so every newly opened connection is now discarded and the pool loops in Broken/backoff forever, whereas before a failed USE on a fresh connection was just logged and the connection stayed usable.","superpowers-review":"PoolRefiller::use_keyspace sets current_keyspace unconditionally before USE is attempted, and with discard-on-failure every new connection is rejected as long as USE keeps failing, draining pools, publishing Broken(UseKeyspaceError), and killing the session for all queries including fully-qualified ones; pre-PR this degraded gracefully, and the larger blast radius is undocumented.","mattpocock-review":"UseKeyspaceError includes permanently-failing variants; if the keyspace later becomes inaccessible, every new connection is discarded, the pool never fills, the node is reported down cluster-wide via ConnectivityChangeEvent::Lost, and reconnect backoff grows unboundedly - a larger blast radius than 'preserves the current pool' suggests, worth a deliberate retryable-vs-permanent distinction.","tob-diff-review":"post-PR every new connection with a failed use_keyspace is discarded, so pools never fill, the refiller churns full handshakes against every node forever at max_fill_backoff, and pools drain to Broken caus
