ing nodes to drop out of load balancing.","ce-code-review":"A permanent USE KEYSPACE failure now prevents the pool from filling and publishes MaybePoolConnections::Broken (node reads as unreachable) instead of previously publishing a connection with the wrong keyspace; this user-visible trade-off is not called out anywhere discoverable in the PR."},"targetId":"quillstone"},{"id":"I3","title":"Untimed use_keyspace await in start_setting_keyspace_for_connection can wedge the refiller forever","file":"scylla/src/network/connection_pool.rs","line":1341,"kind":"bug","severity":"high","verdict":"real","verdictReason":"connection_pool.rs:1336 still carries '// TODO: There should be a timeout for this' and the await at 1341-1345 is unwrapped, unlike PoolRefiller::use_keyspace which wraps its USE in tokio::time::timeout(connect_timeout, ...) at 1310. A node that completes the handshake but never answers USE leaves the future pending in ready_connections, so is_filling() (connection_pool.rs:743) stays true and need_filling() never becomes true again.","introducedByPr":false,"scope":"out-of-scope","scopeReason":"The untimed await and its TODO are byte-identical in semantics to main; the PR changed only what the future resolves to, not whether it can hang.","reportedBy":["tob-rust-review","ce-code-review","superpowers-review"],"reportedAs":{"tob-rust-review":"This await has no timeout (unlike the sibling PoolRefiller::use_keyspace, which wraps its USE in tokio::time::timeout), so a server that accepts the connection but never answers USE leaves the future pending forever, permanently stopping all refills for that node; the PR adds an explicit-failure path but doesn't close this silent-stall path.","ce-code-review":"The `connection.use_keyspace(&keyspace_name).await` call has no timeout, so a node that accepts TCP but never answers USE leaves the future pending inside ready_connections forever, keeping is_filling() true indefinitely and preventing any further refill from being scheduled.","superpowers-review":"The missing USE timeout at :1336 is a pre-existing TODO set aside as pre-existing/unrelated, though this PR enlarges its blast radius."},"targetId":"quillstone"},{"id":"I4","title":"Shard-aware-miss discard drops a counted connection without decrementing total_connections","file":"scylla/src/network/connection_pool.rs","line":994,"kind":"bug","severity":"medium","verdict":"real","verdictReason":"In the `else if evt.requested_shard.is_some()` arm (connection_pool.rs:994-1006) the owned Connection is dropped and replaced via start_opening_connection(None) with no dec_total_connections(); count_in_metrics already incremented it at open (connection_pool.rs:1046-1053) and nothing else decrements (grep shows the only dec sites are in connection_pool.rs). I added a probe test driving one accepted connection plus one shard-aware attempt onto the full shard: get_total_connections() read 2 with a single pooled connection.","introducedByPr":false,"scope":"in-scope","scopeReason":"Commit de164845 explicitly sets out to balance total_connections across pool-discard sites and fixes three of four; this is the one it missed.","reportedBy":["builtin-code-review","ce-code-review","superpowers-review","tob-rust-review","tob-diff-review","mattpocock-review"],"reportedAs":{"builtin-code-review":"This branch drops an already-inc_total_connections()-counted Connection and retries on the regular port, leaving the one remaining hole in the decrement invariant the PR establishes elsewhere; under source-port-rewriting NAT the counter inflates without bound.","ce-code-review":"In handle_ready_connection's shard-aware-port-miss branch, the connection is dropped without being stored anywhere, but inc_total_connections() was already called when it opened, so total_connections leaks upward on every shard-aware-port miss (e.g. behind NAT).","superpowers-review":"A shard-aware connection landing on an already-full shard is dropped after inc_total_connections() charged it at :1051, with nothing decrementing it; reviewer reproduced the gauge drifting to 2 while the pool holds 1.","tob-rust-review":"In the else-if arm for a requested shard, the owned connection is dropped without decrementing total_connections even though it was counted at open, permanently inflating the metric on every shard-aware connection landing on a full bucket.","tob-diff-review":"The metrics-balancing commit fixes three of four discard sites, but the shard-mismatch drop at connection_pool.rs:994 still leaks.","mattpocock-review":"In the else if evt.requested_shard.is_some() branch (:994-1006), the excess shard-aware connection is dropped with no dec_total_connections() call, so the counter only ever drifts upward."},"targetId":"quillstone"},{"id":"I5","title":"PoolRefiller has no Drop impl, so pool teardown leaks the whole total_connections count","file":"scylla/src/network/connection_pool.rs","line":697,"kind":"bug","severity":"medium","verdict":"real","verdictReason":"run() bare-returns at connection_pool.rs:697 when the use-keyspace channel closes, and there is no `impl Drop for PoolRefiller` anywhere (only connection.rs:217 OrphanhoodNotifier has a Drop). conns and excess_connections are dropped with no decrement. The new test at connection_pool.rs:2011 asserts get_total_connections() == 1 after `worker.await`, i.e. after the refiller has been dropped with one connection still in it, so it encodes the leak as expected behavior.","introducedByPr":false,"scope":"out-of-scope","scopeReason":"The teardown path and its missing decrement are unchanged from main; the PR neither introduced nor worsened it, though its new test now bakes the behaviour in.","reportedBy":["anthropic-pr-review","builtin-code-review","superpowers-review","tob-rust-review","tob-diff-review"],"reportedAs":{"anthropic-pr-review":"The PR adds metric decrements at three clear sites but there is no impl Drop for PoolRefiller and no decrement when the refiller task exits (run() returning on keyspace-channel-closed), so dropping a pool (node removal or session shutdown) leaks the full total_connections count.","builtin-code-review":"Tearing a pool down (node removed, session dropped) leaks the count of every connection still in conns/excess_connections; this is the same accounting class the PR is closing but is pre-existing/out of scope and not covered by the new tests.","superpowers-review":"Tearing a pool down leaks its whole count because there's no Drop on PoolRefiller; this is pre-existing and a test actually depends on this behavior.","tob-rust-review":"When the keyspace-request channel closes and run() returns, PoolRefiller and all its Arc\u003cConnection> entries are dropped with no decrement and no Drop impl, permanently inflating the gauge by the pool's size on every node removal or session drop.","tob-diff-review":"Refiller teardown still leaks (the fourth discard site not fixed by the metrics-balancing commit), which the new test at line 2011 actually encodes."},"targetId":"quillstone"},{"id":"I6","title":"Keyspace-setup failure log downgraded from warn! to debug! as it became consequential","file":"scylla/src/network/connection_pool.rs","line":903,"kind":"bug","severity":"medium","verdict":"real","verdictReason":"The diff removes the warn!(\"[{}] Failed to set keyspace for new connection\") from start_setting_keyspace_for_connection and re-emits the same message at debug! in the new Keyspace arm (connection_pool.rs:902-906). update_shared_conns is only reached when `!self.is_filling() && self.is_empty()`, so with any surviving connection a persistently failing USE produces nothing at default log level while the pool silently stops growing.","introducedByPr":true,"scope":"in-scope","scopeReason":"The PR performed the downgrade in the same commit that made the failure fatal to the connection.","reportedBy":["anthropic-pr-review","mattpocock-review","superpowers-review"],"reportedAs":{"anthropic-pr-review":"The removed code logged the keyspace-setting failure at warn!, but the new branch logs the same message at debug!, even though the consequence is now more severe (connection dropped, pool may go Broken).","mattpocock-review":"The spec said the pool logs the error but still reports success; the warn! at this site was replaced with debug!, so operators lose the only signal at default log level.","superpowers-review":"Old code warned while keeping the connection; new code debugs while discarding it, and with a non-empty pool update_shared_conns isn't called, so nothing surfaces the error at default levels and the pool silently stops growing."},"targetId":"quillstone"},{"id":"I7","title":"Hoisting the keyspace check above maybe_reshard defers sharder and shard-aware-port discovery","file":"scylla/src/network/connection_pool.rs","line":911,"kind":"design","severity":"low","verdict":"real","verdictReason":"The diff moves the current_keyspace check (connection_pool.rs:911-926) above the sharding block that was previously first, so self.sharder and self.shard_aware_port are only adopted after a successful USE. keyspace_setup_failure_preserves_pool_state asserts exactly this with `assert!(refiller.sharder.is_none())` after the failed USE, so it is deliberate - but while USE keeps failing the refiller never learns the node is sharded and the PR description does not mention the change.","introducedByPr":true,"scope":"in-scope","scopeReason":"The reordering is part of this diff and its documented rationale is missing from the PR description.","reportedBy":["anthropic-pr-review","mattpocock-review","tob-rust-review","ce-code-review","superpowers-review"],"reportedAs":{"anthropic-pr-review":"Moving the keyspace check above maybe_reshard/shard-aware-port update means a connection whose USE fails never contributes its ShardInfo, so the pool never learns sharder or shard_aware_port while keyspace setup keeps failing.","mattpocock-review":"Not requested by the spec: sharder and shard-aware port are no longer adopted from a connection until USE succeeds, so a resharded node's new sharder is never learned if its keyspace is unusable, and block_advanced_shard_awareness detection is deferred behind a USE round trip; defensible but needs stating in the description.","tob-rust-review":"Hoisting the keyspace check above the sharding block means self.sharder and self.shard_aware_port are no longer updated until USE succeeds, so while USE keeps failing the refiller never learns the node is sharded and keeps dialing the non-shard-aware port; the PR's own test suggests this is intended but the PR description doesn't mention this delay.","ce-code-review":"Sharder adoption, maybe_reshard, and shard-aware-port discovery now run only after a successful USE, so while USE keeps failing the refiller keeps a stale sharder and stale shard-aware port.","superpowers-review":"The reorder at :874-893 drops sharder / shard-aware-port learning on the USE-failure path; a test asserts this so it reads intentional, but it needs a one-line comment at the early return."},"targetId":"quillstone"},{"id":"I8","title":"decrement_total_connections does N fetch_sub(1) calls instead of one bulk Metrics helper","file":"scylla/src/network/connection_pool.rs","line":1360,"kind":"perf","severity":"nit","verdict":"real","verdictReason":"connection_pool.rs:1360-1364 loops `self.metrics.dec_total_connections()`, which is a relaxed fetch_sub(1) on an AtomicU64 (metrics.rs:341-343). For PerShard pools excess_connection_limit() is 10 * nr_shards, so clearing on a 64-shard node is ~640 atomic RMWs, and a concurrent get_total_connections() can observe an intermediate value. A dec_total_connections_by(n) on Metrics/metrics_noop would be one operation and would also remove the feature-envy helper from PoolRefiller.","introducedByPr":true,"scope":"in-scope","scopeReason":"The helper is added by this diff.","reportedBy":["anthropic-pr-review","builtin-code-review","ce-code-review","mattpocock-review","tob-rust-review"],"reportedAs":{"anthropic-pr-review":"for _ in 0..count { self.metrics.dec_total_connections(); } performs count separate atomic operations where a dec_total_connections_by(n) method would be one operation and read better at all three call sites.","builtin-code-review":"Since excess_connection_limit() is 10 * nr_shards, clearing the excess pool on a 64-shard node costs ~640 atomic RMWs where a single fetch_sub(count) would do; needs a bulk helper on Metrics/metrics_noop.","ce-code-review":"The helper issues one relaxed fetch_sub(1) per connection where a single fetch_sub(count) would suffice; only observable effect is a transient intermediate value on a relaxed counter.","mattpocock-review":"decrement_total_connections touches none of PoolRefiller's own data and is just a loop around another object's counter; it should be a Metrics method dec_total_connections_by(count) next to dec_total_connections.","tob-rust-review":"dec_total_connections() is called in a for loop over count instead of one fetch_sub(count) call; correct but does N atomic RMWs where one would suffice."},"targetId":"quillstone"},{"id":"I9","title":"dec_total_connections wraps rather than saturating, so a future off-by-one underflows the gauge","file":"scylla/src/observability/metrics.rs","line":342,"kind":"design","severity":"nit","verdict":"real","verdictReason":"metrics.rs:341-343 is a bare `fetch_sub(1, ORDER_TYPE)` on an AtomicU64 with no saturation. The code is as described; no underflowing path is reachable today (every connection in conns/excess_connections was inc'd by count_in_metrics), so this is hardening against the four new decrement sites, two of which decrement by a computed count.","introducedByPr":false,"scope":"out-of-scope","scopeReason":"The unsaturated fetch_sub predates the diff and no over-decrement path exists today.","reportedBy":["ce-code-review","superpowers-review"],"reportedAs":{"ce-code-review":"Metrics::dec_total_connections is a wrapping AtomicU64 fetch_sub with no saturation; this PR adds four new decrement sites, two by a computed count, so a future off-by-one would underflow the gauge to ~1.8e19 instead of clamping at 0.","superpowers-review":"decrement_total_connections loops N fetch_sub(1) calls against a raw AtomicU64 fetch_sub with no saturation, so one over-decrement wraps to ~1.8e19; a saturating sub_total_connections(n) would fail safe."},"targetId":"quillstone"},{"id":"I10","title":"'decrement then clear excess' pattern duplicated across three call sites, one of them drifted","file":"scylla/src/network/connection_pool.rs","line":674,"kind":"design","severity":"low","verdict":"real","verdictReason":"The pairing appears at connection_pool.rs:674-678 (run loop), :1031-1032 (excess limit) and :1113-1122 (maybe_reshard); the third folds in active_connection_count() and clears self.conns in between, so it is not the same shape. Two of the three sites omitted the decrement before this PR, which is exactly the failure mode a single clear_excess_connections helper would prevent.","introducedByPr":true,"scope":"in-scope","scopeReason":"The duplication is created by this diff's decrement additions.","reportedBy":["anthropic-pr-review","mattpocock-review"],"reportedAs":{"anthropic-pr-review":"Three independent sites must remember to pair the metric decrement with clearing excess connections; a single clear_excess_connections helper would make a fourth site impossible to get wrong, especially since two sites previously omitted the decrement before this PR.","mattpocock-review":"The pattern decrement_total_connections(excess.len()); excess_connections.clear(); appears three times at :674-677, :1031-1032, :1114-1122, and the third variant silently differs (folds in active_connection_count(), clears conns in between); should be extracted into one clear_excess_connections method."},"targetId":"quillstone"},{"id":"I11","title":"Private ConnectionSetupError overlaps the public ConnectionError::UseKeyspaceError added in the same PR","file":"scylla/src/network/connection_pool.rs","line":1418,"kind":"design","severity":"low","verdict":"real","verdictReason":"connection_pool.rs:1418-1421 defines `enum ConnectionSetupError { Connection(ConnectionError), Keyspace(UseKeyspaceError) }` while errors.rs:599-602 adds `ConnectionError::UseKeyspaceError(#[from] UseKeyspaceError)` in the same diff, so the same two-case split is now expressible in one type. Collapsing it would lose the exhaustive local match (ConnectionError is #[non_exhaustive]), so this is a trade-off rather than a clear win.","introducedByPr":true,"scope":"in-scope","scopeReason":"Both types are introduced by this diff.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"The new private ConnectionSetupError enum overlaps the public ConnectionError::UseKeyspaceError variant added by the same PR; a nested match arm could carry both cases and the private enum could be deleted."},"targetId":"quillstone"},{"id":"I12","title":"ConnectionSetupError is undocumented and name-collides with the public ConnectionSetupRequestError","file":"scylla/src/network/connection_pool.rs","line":1418,"kind":"style","severity":"nit","verdict":"real","verdictReason":"The new enum at connection_pool.rs:1418 has no doc comment, does not implement std::error::Error, and sits in a file that imports errors::ConnectionSetupRequestError - which it also wraps transitively via ConnectionError. It is really an outcome tag for OpenedConnectionEvent, so a name like OpenedConnectionError would read more honestly.","introducedByPr":true,"scope":"in-scope","scopeReason":"The type is added by this diff.","reportedBy":["mattpocock-review","superpowers-review"],"reportedAs":{"mattpocock-review":"ConnectionSetupError sits one import away from the public ConnectionSetupRequestError and isn't an Error impl at all, just a two-way outcome tag for OpenedConnectionEvent; OpenedConnectionError would read more honestly.","superpowers-review":"ConnectionSetupError is undocumented and name-collides with the public errors::ConnectionSetupRequestError, which it also contains."},"targetId":"quillstone"},{"id":"I13","title":"UseKeyspaceError under ConnectionError contradicts that type's 'connection must be dropped' doc contract","file":"scylla/src/errors.rs","line":599,"kind":"design","severity":"low","verdict":"real","verdictReason":"errors.rs:570-572 documents ConnectionError as indicating 'connection can no longer be used and should be dropped', but UseKeyspaceError::KeyspaceNameMismatch and ::RequestTimeout (errors.rs:192-208) do not mean the transport is broken. Since the pool feeds this into MaybePoolConnections::Broken(ConnectionError), users see a healthy-transport failure reported as a connection-level one. The pool does drop the connection, so the contract is honoured in practice - the mismatch is in what the public type communicates.","introducedByPr":true,"scope":"in-scope","scopeReason":"The variant is added by this diff.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"ConnectionError's doc comment says it indicates the connection can no longer be used and should be dropped, but UseKeyspaceError::KeyspaceNameMismatch and RequestTimeout don't mean the transport is broken; flowing into ConnectionPoolError::Broken{last_connection_error} makes users see a healthy-connection error reported as a connection-level failure."},"targetId":"quillstone"},{"id":"I14","title":"Two new keyspace tests omit setup_tracing(), which CONTRIBUTING.md requires","file":"scylla/src/network/connection_pool.rs","line":1474,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"keyspace_setup_failure_triggers_refill (connection_pool.rs:1474) and keyspace_setup_failure_preserves_pool_state (:1526) have no setup_tracing() call, while every other test in the module does (lines 1728, 1781, 1869, 1945, 1973, 2047, 2082). CONTRIBUTING.md:84-92 ('Tracing in tests') states that any new tests should call it.","introducedByPr":true,"scope":"in-scope","scopeReason":"Both tests are added by this diff.","reportedBy":["mattpocock-review","superpowers-review","tob-rust-review","anthropic-pr-review"],"reportedAs":{"mattpocock-review":"Two new tests at :1474 and :1526 don't call setup_tracing(), violating CONTRIBUTING.md's 'Tracing in tests' rule that any new tests should call it too; every other test in the module including three metrics tests added on this branch does.","superpowers-review":"The two keyspace tests at :1474 and :1526 skip setup_tracing(), unlike every other test in the module.","tob-rust-review":"The two new tests (at :1474 and :1526) don't call setup_tracing() like every other test in the module, so their tracing output is lost on failure.","anthropic-pr-review":"this is the only test in the module (along with keyspace_setup_failure_triggers_refill) that omits setup_tracing(), so its failures produce no log output."},"targetId":"quillstone"},{"id":"I15","title":"keyspace_setup_failure_triggers_refill asserts need_filling(), which was already true before the event","file":"scylla/src/network/connection_pool.rs","line":1494,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"need_filling() is `!is_filling() && !is_full()` (connection_pool.rs:760-762) and on the freshly constructed refiller ready_connections is empty and the pool is empty, so the assertion holds before handle_ready_connection is called. The refiller is never run(), so nothing verifies a refill is actually scheduled; the test's other assertions (had_error_since_last_refill, Broken shared_conns, metric 0, pool_updated) are meaningful, but the name overstates what is covered.","introducedByPr":true,"scope":"in-scope","scopeReason":"The test is added by this diff.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"The refiller is never run(); the test only asserts need_filling() on a static struct, verifying the predicate rather than that a refill is actually scheduled, so the test name overstates coverage."},"targetId":"quillstone"},{"id":"I16","title":"Hand-forged SET_KEYSPACE frame bytes in test are undocumented and can silently desync from the parser","file":"scylla/src/network/connection_pool.rs","line":1534,"kind":"test-gap","severity":"nit","verdict":"real","verdictReason":"connection_pool.rs:1534 is `Bytes::from_static(b\"\\0\\0\\0\\x03\\0\\x08keyspace\")` with no comment explaining the layout (result kind 3 = SetKeyspace, [short] length 8, name). It is currently consistent with the RESULT parser - keyspace_setup_failure_preserves_pool_state passes - but a change to RESULT frame parsing would desync the fixture with no compile-time signal.","introducedByPr":true,"scope":"in-scope","scopeReason":"The fixture is added by this diff.","reportedBy":["anthropic-pr-review","ce-code-review"],"reportedAs":{"anthropic-pr-review":"Bytes::from_static(b\"\\0\\0\\0\\x03\\0\\x08keyspace\") is a hand-encoded Result/SetKeyspace body with no comment explaining the layout (result kind 3, short length 8, name), forcing anyone changing the keyspace name to rediscover the encoding.","ce-code-review":"The test's hand-forged SET_KEYSPACE result frame was cross-checked against Connection::verify_use_keyspace_result and is currently consistent, but a future change to RESULT frame parsing would silently desync the fixture from the production wire format with no compile-time signal."},"targetId":"quillstone"},{"id":"I17","title":"make_rules re-implements start_simulated_node's OPTIONS/STARTUP rules instead of parameterizing it","file":"scylla/src/network/connection_pool.rs","line":1527,"kind":"design","severity":"nit","verdict":"real","verdictReason":"The closure at connection_pool.rs:1527-1566 rebuilds the same OPTIONS->SUPPORTED and STARTUP->READY rules that start_simulated_node already constructs (connection_pool.rs:1809-1845). The duplication is not free to remove - start_simulated_node takes a non-optional ShardInfo and always advertises SIMULATED_SHARD_AWARE_PORT, while make_rules needs Option\u003cShardInfo>, no shard-aware port, and a QUERY rule - so parameterizing the existing helper is the suggested cleanup rather than a drop-in reuse.","introducedByPr":true,"scope":"in-scope","scopeReason":"The duplicated helper is added by this diff.","reportedBy":["anthropic-pr-review","superpowers-review"],"reportedAs":{"anthropic-pr-review":"make_rules re-implements the OPTIONS/STARTUP rules that start_simulated_node already builds.","superpowers-review":"make_rules at :1527-1566 re-implements start_simulated_node's OPTIONS/STARTUP rules instead of parameterizing the existing function."},"targetId":"quillstone"},{"id":"I18","title":"initial_shard_info passed to start_simulated_node in the resharding test is dead","file":"scylla/src/network/connection_pool.rs","line":1868,"kind":"style","severity":"nit","verdict":"real","verdictReason":"resharding_discards_old_connections_and_balances_metrics builds initial_shard_info, passes it to start_simulated_node (connection_pool.rs:1876), then immediately calls change_request_rules with a SUPPORTED reply carrying an empty options map before any connection is opened; the test then asserts refiller.sharder.is_none(). The value cannot affect the run and misleads a reader into thinking the first connection reports sharding.","introducedByPr":true,"scope":"in-scope","scopeReason":"The test is added by this diff.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"start_simulated_node(initial_shard_info) is immediately followed by change_request_rules that replaces SUPPORTED with a non-sharded response, so initial_shard_info has no effect and is misleading to a reader following the reshard sequence."},"targetId":"quillstone"},{"id":"I19","title":"unrequested_connection_event duplicates shard_aware_attempt_result apart from requested_shard","file":"scylla/src/network/connection_pool.rs","line":1855,"kind":"style","severity":"nit","verdict":"real","verdictReason":"unrequested_connection_event (connection_pool.rs:1855-1866) has the same body as the pre-existing shard_aware_attempt_result (:2018-2033) except that requested_shard is None; generalizing the existing helper to take Option\u003cRequestedShard> would remove the copy.","introducedByPr":true,"scope":"in-scope","scopeReason":"The duplicate helper is added by this diff.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"The new test helper has the same body as the pre-existing shard_aware_attempt_result helper except for requested_shard; generalizing the existing helper would remove the duplication."},"targetId":"quillstone"},{"id":"I20","title":"full_pool metrics test still wall-clock busy-polls despite the 'avoid busy-waiting' commit","file":"scylla/src/network/connection_pool.rs","line":2000,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"connection_pool.rs:2000-2006 spins `while metrics.get_total_connections() != 1 { sleep(1ms) }` inside a real-clock 5s tokio::time::timeout, which is what commit 617139df claims to have fixed. The reviewers' suggested alternative of using pool_updated_notify is not directly available: mock_pool_refiller (connection_pool.rs:1754-1774) constructs both Notify handles inline and does not return them, so wiring an observable signal needs a helper change too.","introducedByPr":true,"scope":"in-scope","scopeReason":"The test and the commit purporting to remove its busy-wait are both in this diff.","reportedBy":["anthropic-pr-review","mattpocock-review","superpowers-review"],"reportedAs":{"anthropic-pr-review":"The test polls get_total_connections() in a 1ms sleep loop under a 5s tokio timeout on a real clock, making it load-sensitive on CI, even though pool_updated_notify is already wired into mock_pool_refiller but unused.","mattpocock-review":"Despite commit 617139df's stated goal of avoiding busy-waiting, the test at :1999-2005 (also flagged at :2002) still spins on get_total_connections() under a 5 second timeout, making it load-sensitive.","superpowers-review":"The avoid-busy-waiting fix at :1993-2000 is still a 1ms poll loop, and leans on select! picking the initial scheduled_refill branch with zero opens."},"targetId":"quillstone"},{"id":"I21","title":"maybe_reshard's excess_connections decrement term is never exercised with a non-empty excess pool","file":"scylla/src/network/connection_pool.rs","line":1113,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"resharding_discards_old_connections_and_balances_metrics feeds exactly one connection before resharding and then asserts excess_connections.is_empty(), so the `+ self.excess_connections.len()` half of the sum at connection_pool.rs:1113-1115 is always zero in the test; a miscount there would pass undetected.","introducedByPr":true,"scope":"in-scope","scopeReason":"Both the decrement and its test are added by this diff.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"The test reshards with an empty excess_connections, so a miscount in the excess half of the new decrement sum would pass undetected."},"targetId":"quillstone"},{"id":"I22","title":"No test covers a pool going Broken(UseKeyspaceError) and recovering to Ready","file":"scylla/src/network/connection_pool.rs","line":1526,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"keyspace_setup_failure_preserves_pool_state deliberately keeps one connection alive throughout, so shared_conns never becomes Broken there; keyspace_setup_failure_triggers_refill reaches Broken but never drives a subsequent successful USE. The Broken -> Ready transition, and with it the emit_events Lost -> Established sequence (connection_pool.rs:1158-1190), is untested.","introducedByPr":true,"scope":"in-scope","scopeReason":"The Broken(UseKeyspaceError) state is newly reachable because of this diff.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"No test covers that a pool which went Broken(UseKeyspaceError) flips back to Ready once a later refill's USE succeeds."},"targetId":"quillstone"},{"id":"I23","title":"No test covers keyspace failure emptying the pool and firing ConnectivityChangeEvent::Lost","file":"scylla/src/network/connection_pool.rs","line":1157,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"update_shared_conns calls emit_events (connection_pool.rs:1152-1190), which produces ConnectivityChangeEvent::Lost when the pool transitions to empty. keyspace_setup_failure_preserves_pool_state keeps one connection alive so the transition never happens, and keyspace_setup_failure_triggers_refill constructs the refiller without a host_id, so no Lost event is produced or observed anywhere.","introducedByPr":true,"scope":"in-scope","scopeReason":"This diff is what makes a keyspace failure able to empty a pool and publish Lost.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"No test covers the keyspace-failure-empties-the-pool path leading to emit_events firing a Lost connectivity event; the existing test deliberately keeps one connection alive so this path is never exercised."},"targetId":"quillstone"},{"id":"I24","title":"No test confirms refill backoff grows across repeated keyspace failures, or covers a USE that never answers","file":"scylla/src/network/connection_pool.rs","line":1474,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"keyspace_setup_failure_triggers_refill checks only that had_error_since_last_refill is set after a single forged failure; nothing drives multiple refill cycles to observe refill_delay_strategy.on_fill_error(), and the tests forge an already-returned keyspace error rather than a USE that never responds, which is the scenario behind I3.","introducedByPr":true,"scope":"in-scope","scopeReason":"Both behaviours belong to the failure path this diff introduces.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"keyspace_setup_failure_triggers_refill checks only that the flag is set after a single failure; no test confirms refill_delay_strategy.on_fill_error() actually increases backoff across repeated failures. Existing tests forge an already-returned keyspace error rather than exercising the scenario where USE never responds."},"targetId":"quillstone"},{"id":"I25","title":"No test drives the increment half of the total_connections invariant end to end","file":"scylla/src/network/connection_pool.rs","line":1868,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"All three new metrics tests call metrics.inc_total_connections() by hand before handing an event to handle_ready_connection, rather than letting start_opening_connection's count_in_metrics closure (connection_pool.rs:1046-1053) do it, so the two halves of the invariant are never exercised together.","introducedByPr":true,"scope":"in-scope","scopeReason":"The tests establishing the invariant are added by this diff, though the manual-increment pattern was inherited from existing helpers.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"The two halves of the total_connections invariant are never exercised end-to-end, mirroring an existing pattern from prior commits rather than being introduced here."},"targetId":"quillstone"},{"id":"I26","title":"PR description covers only one of four commits, omitting all the total_connections metric-balancing work","file":"","line":0,"kind":"docs","severity":"low","verdict":"real","verdictReason":"The PR body describes only the keyspace-discard change (commit 7f48315d) and its Validation section lists only keyspace_setup_failure tests; commits de164845, 0d91aa54 and 617139df add decrement_total_connections, three decrement sites and three metrics tests (+415 lines) that are never mentioned, so a reader of the description alone would treat them as unexplained drive-by edits.","introducedByPr":true,"scope":"in-scope","scopeReason":"The description is part of this PR and does not cover three of its four commits.","reportedBy":["ce-code-review","mattpocock-review"],"reportedAs":{"ce-code-review":"The reviewed range contains four commits; two implement and test total_connections metric balancing on pool clears, but the PR description covers only the other two (keyspace-setup-failure discard).","mattpocock-review":"decrement_total_connections and total_connections rebalancing on resharding/excess-pool clearing (3 of 4 commits) are nowhere in the spec, which is confined to treating keyspace setup failure as connection setup failure; the PR description and validation section don't cover it, so it should be a separate issue/PR."},"targetId":"quillstone"},{"id":"I27","title":"Stated validation commands never compile or run the three new metrics-gated tests","file":"scylla/Cargo.toml","line":34,"kind":"docs","severity":"low","verdict":"real","verdictReason":"scylla/Cargo.toml:34 has `default = []` and the three new tests are behind #[cfg(feature = \"metrics\")] (connection_pool.rs:1867, 1943, 1971). Neither `cargo test -p scylla --lib network::connection_pool::tests::keyspace_setup_failure` (which matches only the two ungated keyspace tests) nor `cargo check -p scylla --lib` enables metrics. They do pass: I ran `cargo test -p scylla --lib --features metrics network::connection_pool` and all eight in-process tests passed (many_connections fails identically on main for lack of a reachable node).","introducedByPr":true,"scope":"in-scope","scopeReason":"The Validation section is part of this PR and misdescribes what was run.","reportedBy":["superpowers-review"],"reportedAs":{"superpowers-review":"The three metrics tests are behind the non-default metrics feature, so the quoted cargo test line never compiled them; they do run in CI's --all-features, so this is an accuracy issue in the PR description, not a coverage gap."},"targetId":"quillstone"},{"id":"I28","title":"PR description's 'Fixes: #1682' points at an issue that does not exist in this repository","file":"","line":0,"kind":"docs","severity":"low","verdict":"real","verdictReason":"`gh issue view 1682` in dkropachev/quillstone returns 'Could not resolve to an issue or pull request with the number of 1682'; the number appears to come from upstream scylla-rust-driver. CONTRIBUTING.md requires a `Fixes: #XYZ` line, so the annotation is expected - it just resolves to nothing here.","introducedByPr":true,"scope":"in-scope","scopeReason":"The reference is written in this PR's description.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"gh issue view 1682 fails in dkropachev/quillstone; the referenced issue number appears to be from upstream scylla-rust-driver instead."},"targetId":"quillstone"},{"id":"I29","title":"All four commit messages are subject-only, against CONTRIBUTING.md's what-and-why requirement","file":"","line":0,"kind":"docs","severity":"low","verdict":"real","verdictReason":"`git log --format='%B' main..HEAD` shows all four commits (617139df, 7f48315d, 0d91aa54, de164845) have a subject line and no body, while CONTRIBUTING.md:10 requires that messages 'clearly explain what is being changed in the commit, and what is the reason for the change'. The PR checklist nonetheless ticks 'The commit messages explain what changes and why.'","introducedByPr":true,"scope":"in-scope","scopeReason":"All four commits are this PR's.","reportedBy":["superpowers-review"],"reportedAs":{"superpowers-review":"All four commits are subject-only even though CONTRIBUTING.md:10 requires what and why and repo history follows it; the PR checklist claims otherwise."},"targetId":"quillstone"},{"id":"I30","title":"Commit 617139df is an unsquashed fixup of 0d91aa54","file":"","line":0,"kind":"style","severity":"low","verdict":"real","verdictReason":"617139df ('avoid busy-waiting in metrics test') changes a single line inside the full_pool_clears_excess_connections_and_balances_metrics test that 0d91aa54 added two commits earlier, so it is not a logically coherent standalone change as CONTRIBUTING.md:9 requires.","introducedByPr":true,"scope":"in-scope","scopeReason":"Both commits belong to this PR and can be squashed before merge.","reportedBy":["mattpocock-review","superpowers-review"],"reportedAs":{"mattpocock-review":"Commit 617139df changes one line (yield_now() -> sleep(1ms)) inside a test that 0d91aa54 added two commits earlier, violating CONTRIBUTING.md's 'each commit introduces one logically coherent change' rule; it should be squashed into 0d91aa54.","superpowers-review":"617139df is a fixup to 0d91aa54 and should be squashed."},"targetId":"quillstone"},{"id":"I31","title":"Inline dec_total_connections at the keyspace arm is inconsistent with the new helper and proxy.finish() handling","file":"scylla/src/network/connection_pool.rs","line":901,"kind":"style","severity":"nit","verdict":"false-positive","verdictReason":"connection_pool.rs:901 decrements exactly one connection, so calling dec_total_connections() directly is the natural form; decrement_total_connections(1) would be strictly worse. The proxy.finish() difference is real (connection_pool.rs:1685 matches on the result while other tests use `let _ = ...`), but the new test's version checks for unexpected proxy errors, which is an improvement rather than a defect.","introducedByPr":true,"scope":"in-scope","scopeReason":"Both sites are added by this diff.","reportedBy":["mattpocock-review"],"reportedAs":{"mattpocock-review":":901 calls self.metrics.dec_total_connections() inline while three sibling sites use the new helper; :1689 matches on proxy.finish() while every other test uses let _ = proxy.finish().await;."},"targetId":"quillstone"},{"id":"I32","title":"Keyspace arm sets had_error_since_last_refill even for shard-aware attempts, unlike the Connection arm","file":"scylla/src/network/connection_pool.rs","line":901,"kind":"bug","severity":"low","verdict":"false-positive","verdictReason":"The Connection arm's carve-out (connection_pool.rs:865-883) exists because the shard-aware *port* may be unreachable while the regular port works. In the Keyspace arm the connection was established successfully and only USE failed, so the shard-aware port is demonstrably fine and the error is a genuine fill failure; setting the flag is the correct behaviour, not an unintended divergence.","introducedByPr":true,"scope":"in-scope","scopeReason":"The arm is added by this diff.","reportedBy":["mattpocock-review","ce-code-review"],"reportedAs":{"mattpocock-review":"The Connection arm does an immediate non-shard-aware retry and deliberately doesn't set had_error_since_last_refill for shard-aware failures, but the Keyspace arm has neither carve-out, so a keyspace failure on a shard-aware attempt inflates reconnect backoff for a reason unrelated to connectivity.","ce-code-review":"No test covers the case where requested_shard is Some with a live connection, where the new arm's unconditional had_error_since_last_refill = true diverges from the deliberate no-flag policy of the shard-aware Connection-error arm."},"targetId":"quillstone"},{"id":"I33","title":"New public ConnectionError variant added with no changelog entry","file":"scylla/src/errors.rs","line":599,"kind":"docs","severity":"nit","verdict":"false-positive","verdictReason":"The repository has no changelog: `find . -iname '*changelog*'` outside target/ returns nothing, and docs/source/migration-guides holds only major-version migration docs. There is no convention the PR could have violated, and the variant is doc-commented at errors.rs:599-602.","introducedByPr":true,"scope":"in-scope","scopeReason":"The variant is added by this diff, but there is no changelog to update.","reportedBy":["mattpocock-review"],"reportedAs":{"mattpocock-review":"The new public variant on ConnectionError has no changelog entry despite the checklist asserting docs are unaffected."},"targetId":"quillstone"},{"id":"I34","title":"Pool-full excess clear in the run loop has no test","file":"scylla/src/network/connection_pool.rs","line":673,"kind":"test-gap","severity":"low","verdict":"false-positive","verdictReason":"full_pool_clears_excess_connections_and_balances_metrics (connection_pool.rs:1971-2012) pushes an event into ready_connections and then spawns refiller.run(), which drives exactly the is_full() branch at connection_pool.rs:668-678; the test watches the gauge fall from 3 to 1 and passed when I ran it with --features metrics.","introducedByPr":true,"scope":"in-scope","scopeReason":"The decrement site is added by this diff and is covered by its accompanying test.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"Its decrement is only reachable through the full async worker loop, which no unit test drives."},"targetId":"quillstone"},{"id":"I35","title":"New total_connections tests unnecessarily gated behind the metrics feature","file":"scylla/src/network/connection_pool.rs","line":1867,"kind":"test-gap","severity":"nit","verdict":"false-positive","verdictReason":"The tests assert on Metrics::get_total_connections, which only exists under #[cfg(feature = \"metrics\")] (metrics.rs:527); without the feature the no-op shim in metrics_noop.rs has no getter at all, so the gating is required for the crate to compile with --no-default-features.","introducedByPr":true,"scope":"in-scope","scopeReason":"The gating is added by this diff and is correct.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"Testing reviewer claimed the new total_connections regression tests are unnecessarily gated behind the `metrics` feature."},"targetId":"quillstone"},{"id":"I36","title":"connection_pool.rs is already large and grows another ~415 lines without being split","file":"scylla/src/network/connection_pool.rs","line":1443,"kind":"design","severity":"nit","verdict":"real","verdictReason":"The file goes from 1706 lines on main to 2121 at HEAD (+415), and the growth is almost entirely in the `mod tests` block. Factually accurate, but splitting a module is a refactor well outside what this change asks for.","introducedByPr":true,"scope":"out-of-scope","scopeReason":"Module layout is a pre-existing structural choice; requiring a split here would be unrelated churn.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"Maintainability reviewer claimed the file is already large and this PR adds ~415 more lines without splitting it."},"targetId":"quillstone"},{"id":"I38","title":"Pointer logging via {:p} flagged as a security issue","file":"scylla/src/network/connection_pool.rs","line":683,"kind":"security","severity":"nit","verdict":"false-positive","verdictReason":"The Arc::as_ptr traces at connection_pool.rs:683, :981 and :1247 are pre-existing, emitted at debug/trace level, and untouched by this diff; leaking a heap pointer into a disabled-by-default trace is not an exploitable disclosure in this codebase, and the reporting tool itself rejected the pipeline's MEDIUM rating.","introducedByPr":false,"scope":"out-of-scope","scopeReason":"All three log statements predate the diff and are unmodified.","reportedBy":["tob-rust-review"],"reportedAs":{"tob-rust-review":"The automated pipeline rated PTREXPOSE-001/002/003 (pointer logging at :683, :981, :1247) as MEDIUM, but the reviewer disagrees, noting these are pre-existing Arc::as_ptr traces at debug/trace level, conventional in this driver and untouched by the PR."},"targetId":"quillstone"},{"id":"I39","title":"tests::many_connections fails in this environment","file":"scylla/src/network/connection_pool.rs","line":1720,"kind":"test-gap","severity":"nit","verdict":"false-positive","verdictReason":"The test panics with ConnectTimeout at connection_pool.rs:1720 under `cargo test --features metrics`, but it needs a reachable node and fails identically on main; it is environmental, not a regression from this PR.","introducedByPr":false,"scope":"out-of-scope","scopeReason":"Pre-existing environmental dependency, unaffected by the diff.","reportedBy":["builtin-code-review","mattpocock-review","superpowers-review"],"reportedAs":{"builtin-code-review":"The many_connections test fails under cargo test, but it fails identically on main because the sandbox has no route to the simulated address, so the failure is environmental rather than a regression from this PR.","mattpocock-review":"The many_connections test fails with ConnectTimeout, but the report verified it fails identically on main, so it is pre-existing and not caused by this PR.","superpowers-review":"The many_connections failure needs a live SCYLLA_URI and was set aside as pre-existing/unrelated."},"targetId":"quillstone"},{"id":"I40","title":"Double-decrement of total_connections between the new bulk-clear sites and remove_connection","file":"scylla/src/network/connection_pool.rs","line":1230,"kind":"bug","severity":"low","verdict":"false-positive","verdictReason":"remove_connection's maybe_remove_in_vec (connection_pool.rs:1224-1237) locates the connection by Arc::ptr_eq against self.conns[shard_id] and self.excess_connections. After a bulk clear the Arc is no longer in either vector, so the scan misses, the function falls through to the 'was already removed' trace, and no second decrement happens - even in the window where a stale shared_conns clone keeps the Arc alive so wait_for_error's Weak::upgrade succeeds.","introducedByPr":true,"scope":"in-scope","scopeReason":"The hypothesis concerns decrement sites added by this diff; it does not hold.","reportedBy":["builtin-code-review","mattpocock-review","superpowers-review","ce-code-review"],"reportedAs":{"builtin-code-review":"Cleared connections are no longer findable by ptr_eq, so the decrement in remove_connection is skipped in that path, preventing double-counting with the new maybe_reshard decrement.","mattpocock-review":"Report checked for double-decrements between maybe_reshard/excess-clear and remove_connection and found none: cleared connections either drop to refcount zero (Weak upgrade fails in wait_for_error) or survive only in shared_conns where maybe_remove_in_vec's ptr_eq scan no longer finds them.","superpowers-review":"remove_connection can't double-decrement because of Arc::ptr_eq against already-cleared vectors.","ce-code-review":"The three new bulk-clear decrement sites were checked against remove_connection's own decrement for double-counting under connection death and no double- or missing-decrement path was found, but the interaction depends on Arc lifetimes in stale shared_conns snapshots that was not exhaustively traced."},"targetId":"quillstone"},{"id":"I41","title":"New ConnectionError::UseKeyspaceError variant is a semver break or breaks exhaustive matches","file":"scylla/src/errors.rs","line":599,"kind":"design","severity":"nit","verdict":"false-positive","verdictReason":"ConnectionError already carries #[non_exhaustive] (errors.rs:574), so adding a variant is semver-minor and downstream matches must already have a wildcard arm; there is no exhaustive in-crate match over it, and the crate builds and tests cleanly with the variant present.","introducedByPr":true,"scope":"in-scope","scopeReason":"The variant is added by this diff and is safe.","reportedBy":["builtin-code-review","mattpocock-review","superpowers-review","tob-rust-review"],"reportedAs":{"builtin-code-review":"The enum is #[non_exhaustive] with no exhaustive matches in-tree, and size_of::\u003cConnectionError>() is unchanged at 112 bytes on both branches, staying under the result_large_err clippy threshold, so the new variant is safe.","mattpocock-review":"Report checked whether adding the new public variant breaks semver and found ConnectionError is already #[non_exhaustive], so the addition is semver-minor, not a violation.","superpowers-review":"#[non_exhaustive] was already on ConnectionError, so the new variant is not a semver break.","tob-rust-review":"ConnectionError is #[non_exhaustive], so the added variant is semver-minor, and #[from] UseKeyspaceError doesn't collide with existing impls."},"targetId":"quillstone"},{"id":"I1","title":"New regression test is flaky: rpc::stream_closed escapes the test body at smp>1","file":"tests/unit/rpc_test.cc","line":2028,"kind":"test-gap","severity":"high","verdict":"real","verdictReason":"Built build/dev and ran the new case 60x with `-- -c2`: 4 runs failed with `fatal error: in \"test_stream_send_after_stream_close\": seastar::rpc::stream_closed: rpc stream was closed by peer` (0/40 at -c1). The client's stream_close()->stop() tears the connection down, the server's stream read loop hits EOF, sets _error and runs _stream_queue.abort(stream_closed()) (src/rpc/rpc.cc:1285) before the server fiber's `while (source().get()) {}` consumed the queued eof marker; the throw escapes seastar::async and surfaces at server_done.get().","introducedByPr":true,"scope":"in-scope","scopeReason":"The PR adds this test; test.py's default --smp 2 makes it fail roughly 7% of runs.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"Test's server-handler read loop may raise stream_closed during normal shutdown and escape server_done.get() (retained as residual risk only, with no demonstrated trigger)."},"targetId":"ironweave"},{"id":"I2","title":"stream_close() now gates write_buf.close()/stop()/abort() behind an unbounded queue drain","file":"src/rpc/rpc.cc","line":562,"kind":"bug","severity":"high","verdict":"real","verdictReason":"src/rpc/rpc.cc:565-572 chains write_buf.close() and then stop() after `queue_drained`. Pre-PR write_buf.close() ran immediately and its `_fd.close()` is posix_data_sink_impl::close() = `_fd.shutdown(SHUT_WR)` (src/net/posix-stack.cc:894-897), which is exactly what unwedges a send_entry() parked in pollable_fd::write_all() on a full peer window; stop()->abort()->shutdown_input() (rpc.cc:353-359) is likewise what ends the receive loop so stop_send_loop() can call shutdown_output() (rpc.cc:200-202). Both escape hatches are now downstream of the very write they would have to break, so a frame parked on peer backpressure leaves the connection, its fd and its buffers hung with no timeout.","introducedByPr":true,"scope":"in-scope","scopeReason":"The drain wait is added by this PR's own hunk.","reportedBy":["builtin-code-review","ce-code-review","mattpocock-review","superpowers-review","anthropic-pr-review"],"reportedAs":{"builtin-code-review":"stream_close() now defers stop()/abort()/shutdown_input() behind outgoing-queue drain, allowing hangs. Previously write_buf.close() returned promptly even with a write in flight and the immediate stop() eventually caused stop_send_loop() to call shutdown_output() and break a stalled send.","ce-code-review":"stream_close() gates stop()/abort() behind an unbounded queue drain. abort() is the only mechanism that can fail a stuck low-level write; if a frame is parked on peer backpressure, queue_drained never resolves and the connection's fd, buffers, and teardown state leak forever with no timeout or cancellation.","mattpocock-review":"New outgoing-queue drain can gate/hang the abort path via sink.close(). A front entry stuck in send_entry() behind TCP backpressure from a live-but-not-reading peer can hang sink.close() with shutdown_output() sequestered behind it.","superpowers-review":"The drain wait is unbounded; the comment would be more useful naming what breaks it (stop_send_loop's shutdown_output) rather than only who no longer waits. Not a regression.","anthropic-pr-review":"(self-rejected) Reviewer checked for a new deadlock from deferring write_buf.close() and found none: pre-PR the same socket flush already gated stop()."},"targetId":"ironweave"},{"id":"I3","title":"Unguarded put(std::span) override breaks the build at SEASTAR_API_LEVEL 7 and 8","file":"tests/unit/rpc_test.cc","line":1883,"kind":"bug","severity":"medium","verdict":"real","verdictReason":"Compiled tests/unit/rpc_test.cc with -fsyntax-only at -DSEASTAR_API_LEVEL=8 and =7: three hard errors ('marked override, but does not override', 'no matching function for call to seastar::data_sink::put(std::span\u003c...>&)', 'invalid new-expression of abstract class type'). The same file from main compiles clean at level 8. data_sink_impl::put(std::span) is behind `#if SEASTAR_API_LEVEL >= 9` (include/seastar/core/iostream.hh:110-128); loopback_socket.hh:144-153 already uses the required #if/#else pattern, and configure.py --api-level still accepts 7/8.","introducedByPr":true,"scope":"in-scope","scopeReason":"The offending override is added by this PR and main builds fine at those levels.","reportedBy":["anthropic-pr-review","builtin-code-review","ce-code-review","superpowers-review","tob-diff-review"],"reportedAs":{"anthropic-pr-review":"Unguarded put(span) override breaks build below API level 9; the build breaks with three errors since the test doesn't use the existing #if SEASTAR_API_LEVEL >= 9 fallback pattern used elsewhere.","builtin-code-review":"test_data_sink_impl fails to compile at SEASTAR_API_LEVEL 7/8; the class is abstract and the override refers to nothing, causing a hard compile error.","ce-code-review":"test_data_sink_impl's put(std::span) override isn't guarded by SEASTAR_API_LEVEL, breaking the build at levels CMakeLists.txt still offers.","superpowers-review":"put(std::span\u003ctemporary_buffer\u003cchar>>) override breaks builds at --api-level=7|8.","tob-diff-review":"The override is unguarded but that member only exists under SEASTAR_API_LEVEL >= 9; below 9 this causes an override-of-nothing error and leaves the class abstract."},"targetId":"ironweave"},{"id":"I4","title":"Regression test never asserts the send was refused; closed_error is swallowed","file":"tests/unit/rpc_test.cc","line":2016,"kind":"test-gap","severity":"medium","verdict":"real","verdictReason":"tests/unit/rpc_test.cc:2016-2021 is `try { stream_send_empty_frame().get(); } catch (const rpc::closed_error&) { }` with no assertion in either branch. The PR's whole added contract (send() fails once stream_close() has begun) is therefore unasserted; the only check left is the indirect BOOST_REQUIRE_MESSAGE(!st.put_after_close) at :2030. BOOST_REQUIRE_THROW would pin it.","introducedByPr":true,"scope":"in-scope","scopeReason":"The test is added by this PR.","reportedBy":["anthropic-pr-review","ce-code-review","mattpocock-review","superpowers-review","tob-diff-review"],"reportedAs":{"anthropic-pr-review":"try/catch around stream_send_empty_frame().get() asserts nothing in either branch, so if send() wrongly accepts the frame the test still passes; only a second-order check that depends on poller timing catches it.","ce-code-review":"The refused send()'s closed_error is caught by a bare try/catch and discarded with nothing asserted, so the test's only real signal is an indirect timing-dependent check.","mattpocock-review":"stream_send_empty_frame().get() is wrapped in a try with an empty catch(closed_error&), so nothing requires the throw; BOOST_REQUIRE_THROW would pin it properly.","superpowers-review":"The test never asserts the send was refused; catch (closed_error&) {} swallows the success case too.","tob-diff-review":"The try/catch (const rpc::closed_error&) passes whether or not the frame is rejected; needs BOOST_REQUIRE_THROW or a BOOST_FAIL after the .get()."},"targetId":"ironweave"},{"id":"I5","title":"Queue-drain half of the fix has no test coverage at all","file":"src/rpc/rpc.cc","line":562,"kind":"test-gap","severity":"medium","verdict":"real","verdictReason":"Verified by experiment: reverting only the std::exchange/then_wrapped hunk (keeping _stream_closing) and rebuilding leaves the new test passing 20/20. The cause is structural: sink_impl::close() awaits the eof-marker send() before `f.finally([con]{ return con->close_sink(); })` (include/seastar/rpc/rpc_impl.hh:911-924), so _outgoing_queue is already empty and queue_drained is already resolved when stream_close() runs. The exceptional branch (then_wrapped/ignore_ready_future) and the concurrent stop_send_loop() interleaving are likewise never exercised.","introducedByPr":true,"scope":"in-scope","scopeReason":"This is the riskier half of the PR's own fix (see I2) and the PR is where its test belongs.","reportedBy":["anthropic-pr-review","ce-code-review","tob-diff-review"],"reportedAs":{"anthropic-pr-review":"Deleting lines 562-568 (the queue_drained handling) leaves the new regression test passing, so this riskier half of the fix, which changes what stop_send_loop() sees, is untested.","ce-code-review":"The then_wrapped/ignore_ready_future() branch is never exercised because the new test only ever queues an eof marker that always succeeds; also no test drives _outgoing_queue_ready to be non-ready at the moment stream_close() runs, and no test covers stop_send_loop() running concurrently with a parked stream_close().","tob-diff-review":"_outgoing_queue is empty when the test reaches stream_close() because sink_impl::close() awaits the eof-marker send() before calling close_sink(); reverting the std::exchange/then_wrapped hunk while keeping _stream_closing still leaves the new test green."},"targetId":"ironweave"},{"id":"I6","title":"Server compressor factory's hooks vector is mutated cross-shard by negotiate()","file":"tests/unit/rpc_test.cc","line":1957,"kind":"bug","severity":"medium","verdict":"real","verdictReason":"server_factory is a stack local on shard 0, but loopback_socket_impl::connect() round-robins server connections via _factory.next_shard() (tests/unit/loopback_socket.hh:343-345), so at --smp 2 the stream connection's server side negotiates on shard 1 and runs const_cast\u003c...>(this)->hooks.push_back(...) against a shard-0 std::vector, concurrently with shard 0's own push_back for the parent connection. That is an unsynchronised cross-shard mutation plus a shard-1 allocation later freed on shard 0.","introducedByPr":true,"scope":"in-scope","scopeReason":"The factory and its cross-shard use are added by this PR.","reportedBy":["superpowers-review"],"reportedAs":{"superpowers-review":"server_factory lives on shard 0 but loopback_socket_impl::connect round-robins server connections, so at default --smp 2 the stream connection's negotiate() runs const_cast\u003c...>(this)->hooks.push_back(...) on shard 1 against a shard-0 vector — unsynchronized mutation with a buffer allocated by shard 1's allocator and freed by shard 0, which is UB that ASan/UBSan won't catch."},"targetId":"ironweave"},{"id":"I7","title":"Comment claims nothing else waits on _outgoing_queue_ready, but stop_send_loop() does","file":"src/rpc/rpc.cc","line":559,"kind":"docs","severity":"low","verdict":"real","verdictReason":"src/rpc/rpc.cc:559-561 says 'Nothing else waits for _outgoing_queue_ready from here on: ... stop_send_loop() waits for _sink_closed_future.' stop_send_loop() literally does `when_all(std::move(_outgoing_queue_ready), std::move(_sink_closed_future))` at rpc.cc:225. The load-bearing property is that after the exchange that wait is vacuous and the drain guarantee flows through _sink_closed_future instead; the comment does not say that, which is what protects the pair from being reordered.","introducedByPr":true,"scope":"in-scope","scopeReason":"The comment is new in this PR.","reportedBy":["anthropic-pr-review","mattpocock-review","tob-diff-review"],"reportedAs":{"anthropic-pr-review":"The comment says nothing else waits for _outgoing_queue_ready, but stop_send_loop() does wait on it; the real point (that the wait becomes vacuous after the exchange, with the drain guarantee flowing through _sink_closed_future) is nowhere stated.","mattpocock-review":"The comment claims stop_send_loop() waits only on _sink_closed_future, but it still waits on both futures; the real safety property is that the queue-ready wait is subsumed by _sink_closed_future.","tob-diff-review":"The comment states 'Nothing else waits for _outgoing_queue_ready from here on', but stop_send_loop() does wait on it, at src/rpc/rpc.cc:225; the code itself is correct, but the comment misstates it."},"targetId":"ironweave"},{"id":"I8","title":"Comment names the wrong cause for an exceptional _outgoing_queue_ready","file":"src/rpc/rpc.cc","line":566,"kind":"docs","severity":"low","verdict":"real","verdictReason":"src/rpc/rpc.cc:566 says '_outgoing_queue_ready is exceptional if an entry failed'. send()'s own continuation swallows send_entry() failures (`if (f.failed()) { f.ignore_ready_future(); abort(); } p->done.set_value();`, rpc.cc:333-338), so a failed entry resolves the chain normally. The real sources are withdraw(it, ex) (rpc.cc:288) and stop_send_loop()'s `it->done.set_exception(ex)` / `_negotiated->set_exception(ex)` — which the neighbouring pre-existing comment at rpc.cc:226-227 states correctly.","introducedByPr":true,"scope":"in-scope","scopeReason":"The comment is new in this PR.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"The new comment claims _outgoing_queue_ready is exceptional if an entry failed, but entry failures are swallowed by send()'s continuation; the real causes are withdraw(it, ex) and _negotiated->set_exception() from a concurrent stop_send_loop()."},"targetId":"ironweave"},{"id":"I9","title":"Lambda parameter f shadows the function-scope f it is being assigned to","file":"src/rpc/rpc.cc","line":565,"kind":"style","severity":"nit","verdict":"real","verdictReason":"`auto f = make_ready_future\u003c>();` at rpc.cc:549 and the continuation parameter `(future\u003c> f)` at rpc.cc:565 inside the statement assigning that same f; the one place an exception is deliberately discarded reads as f = ...f....","introducedByPr":true,"scope":"in-scope","scopeReason":"Introduced by this PR's hunk.","reportedBy":["anthropic-pr-review","mattpocock-review","superpowers-review"],"reportedAs":{"anthropic-pr-review":"The lambda parameter f shadows the function-scope f being assigned, making the statement read as f = ...f... in the one place an exception is deliberately discarded; should be renamed to drained.","mattpocock-review":"The lambda parameter named f shadows the outer f declared at rpc.cc:549, inside the assignment to that same variable; should be renamed to drained.","superpowers-review":"The inner lambda param f shadows the auto f from line 549, in the statement assigning the outer one."},"targetId":"ironweave"},{"id":"I10","title":"Docs overstate that both halves of a stream must always be closed","file":"doc/rpc-streaming.md","line":106,"kind":"docs","severity":"low","verdict":"real","verdictReason":"connection::_sink_closed and _source_closed both default to true (include/seastar/rpc/rpc.hh:300-301) and are only cleared by sink_impl's and source_impl's constructors (rpc_impl.hh:839, :494). A connection on which the application was only ever handed a sink therefore reaches stream_check_twoway_closed() with no source involved, so 'both halves' should read 'each half you were given'. Same wording on rpc::sink's new doxygen block (rpc_types.hh:341-342).","introducedByPr":true,"scope":"in-scope","scopeReason":"The sentence is added by this PR.","reportedBy":["anthropic-pr-review","superpowers-review"],"reportedAs":{"anthropic-pr-review":"The doc and rpc_types.hh both claim shutdown requires both halves closed, but _sink_closed and _source_closed default to true and are only cleared by the respective impl constructors, so a connection with only a sink never needs a source to close for stream_close() to run.","superpowers-review":"\"Both halves of a stream must be closed\" overstates it; with no returned sink, _source_closed is true from construction (rpc.hh:301), so the doc should say \"each half you were given\"."},"targetId":"ironweave"},{"id":"I11","title":"\"Shut down only once both halves are closed\" ignores error and peer-driven teardown","file":"doc/rpc-streaming.md","line":115,"kind":"docs","severity":"nit","verdict":"real","verdictReason":"doc/rpc-streaming.md:115 says the connection is shut down 'only once both halves are closed', which contradicts the same file's line 49 ('closing the client aborts any stream still open on it') and the error paths in src/rpc/rpc.cc:1062-1067 and :1284-1289 that tear the stream down regardless. The word 'only' should go.","introducedByPr":true,"scope":"in-scope","scopeReason":"The sentence is added by this PR.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"Line 115's claim that the stream shuts down only once both halves are closed contradicts line 49's statement that closing the client aborts any stream still open on it; error paths and peer shutdown also tear it down, so \"only\" should be dropped."},"targetId":"ironweave"},{"id":"I12","title":"#closing-a-stream anchor does not resolve in the doxygen build","file":"doc/rpc-streaming.md","line":51,"kind":"docs","severity":"low","verdict":"real","verdictReason":"doc/rpc-streaming.md is in doxygen's INPUT (doc/Doxyfile.in:764) and MARKDOWN_ID_STYLE is absent from Doxyfile.in, so doxygen 1.9.8 (the version installed here) uses its default DOXYGEN id style and gives headings autotoc_md\u003cN> ids rather than GitHub slugs. The link is the only markdown anchor reference in any of the four doxygen-fed .md files, so there is no working precedent to copy.","introducedByPr":true,"scope":"in-scope","scopeReason":"The link is added by this PR.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"Because MARKDOWN_ID_STYLE is unset in Doxyfile.in, header IDs become autotoc_md\u003cN> rather than GitHub slugs, so the #closing-a-stream anchor resolves on GitHub but produces an unresolved-reference warning and renders as plain text in the generated API docs."},"targetId":"ironweave"},{"id":"I13","title":"send_empty_frame's contract comment not updated for the widened closed_error window","file":"include/seastar/rpc/rpc_types.hh","line":318,"kind":"docs","severity":"low","verdict":"real","verdictReason":"The comment at rpc_types.hh:318-320 documents only what send_empty_frame does and when it may not be called; it says nothing about failure. This PR makes it fail with closed_error for the whole of stream_close(), a window in which it previously succeeded, and the hook is the one API whose failure mode the change widens. Nothing tells callers the failure is expected rather than fatal.","introducedByPr":true,"scope":"in-scope","scopeReason":"The PR widens this API's failure window and commit 3 documents sink/source but not this.","reportedBy":["anthropic-pr-review","superpowers-review"],"reportedAs":{"anthropic-pr-review":"The PR makes send_empty_frame newly fail with closed_error in a window where it previously succeeded, but the doc comment still only describes the old behavior and doesn't warn callers not to treat the failure as fatal.","superpowers-review":"Commit 3 documents sink and source but not send_empty_frame, the one API whose failure mode this PR widens."},"targetId":"ironweave"},{"id":"I14","title":"New doxygen blocks stacked on top of retained legacy one-line comments","file":"include/seastar/rpc/rpc_types.hh","line":337,"kind":"style","severity":"nit","verdict":"real","verdictReason":"rpc_types.hh:337-343 leaves '// send data Out...' between the new /// \\brief block and `class sink`, and :384-390 leaves '// receive data In...' before `class source`, so each class carries two unsynchronised descriptions. Doxygen still associates the /// block correctly, so this is cosmetic.","introducedByPr":true,"scope":"in-scope","scopeReason":"The new blocks are added by this PR.","reportedBy":["anthropic-pr-review","ce-code-review","mattpocock-review"],"reportedAs":{"anthropic-pr-review":"The new doxygen blocks sit on top of legacy comment lines, leaving two comment blocks per class (cosmetic only, doxygen still associates correctly).","ce-code-review":"The new /// \\brief blocks on sink (:337-343) and source (:384-390) are stacked directly on top of the retained one-line comments, so each class carries two unsynced descriptions, unlike every other documented entity in the header.","mattpocock-review":"The new /// \\brief blocks (337-343, 384-389) are separated from class sink / class source by the legacy one-liner comments, which should be folded into the doxygen block."},"targetId":"ironweave"},{"id":"I15","title":"\\ref source in sink's doxygen is ambiguous with connected_socket_impl::source()","file":"include/seastar/rpc/rpc_types.hh","line":341,"kind":"docs","severity":"nit","verdict":"unproven","verdictReason":"rpc_types.hh:341 writes an unqualified `\\ref source`, and `source` is also a member function name on several socket impl classes, so `\\ref rpc::source` would be unambiguous. Whether doxygen actually emits an ambiguity warning here was not settled: I did not run a full doxygen build of the configured INPUT set.","introducedByPr":true,"scope":"in-scope","scopeReason":"The \\ref is added by this PR.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"\\ref source is ambiguous with connected_socket_impl::source() and should be qualified as \\ref rpc::source."},"targetId":"ironweave"},{"id":"I16","title":"Class-level doxygen states the close contract but sink::close() itself still lacks it","file":"include/seastar/rpc/rpc_types.hh","line":337,"kind":"docs","severity":"low","verdict":"real","verdictReason":"The new contract lives only on the class banner at rpc_types.hh:337-342; sink::close() further down still carries only its original one-line comment, so a reader who jumps to the method rather than the class does not see the requirement that close() must be called and awaited.","introducedByPr":true,"scope":"in-scope","scopeReason":"Commit 3 is the documentation commit; this is the same doc gap it set out to close.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"The new class-level doxygen on rpc::sink states the close contract, but sink::close() itself (unchanged by this diff) still carries only its one-line comment, so a reader who opens the method rather than the class banner does not see the contract."},"targetId":"ironweave"},{"id":"I17","title":"Parked data_sink::close() is released on the happy path only, with no scope guard","file":"tests/unit/rpc_test.cc","line":2026,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"tests/unit/rpc_test.cc:2026 `st.release_close.set_value();` is a bare straight-line statement after the try/catch at :2016-2021 and the yield loop at :2022-2024. Any exception other than rpc::closed_error escaping that region leaves the connection parked in output_stream::close() and stop_send_loop(), so the test hangs to the 300s harness timeout or trips ~sink_impl's SEASTAR_ASSERT instead of failing cleanly — even though seastar/util/defer.hh is already included by the file.","introducedByPr":true,"scope":"in-scope","scopeReason":"The parked-close mechanism is added by this PR.","reportedBy":["anthropic-pr-review","ce-code-review"],"reportedAs":{"anthropic-pr-review":"st.release_close.set_value() is a bare statement; any throw between lines 2011 and 2025 leaves it unsatisfied, causing ~sink_impl's SEASTAR_ASSERT to fire or the test to hang instead of producing a diagnosable failure, even though defer is already included.","ce-code-review":"st.release_close.set_value() sits on the straight-line happy path after the try/catch, so any exception other than closed_error escaping the guarded region leaves the connection blocked in output_stream::close() and stop_send_loop(), wedging the test until the 300s harness timeout."},"targetId":"ironweave"},{"id":"I18","title":"close_entered_cv.wait() has no timeout, so a regression hangs rather than fails","file":"tests/unit/rpc_test.cc","line":2011,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"tests/unit/rpc_test.cc:2011 is `st.close_entered_cv.wait([&] { return st.close_entered; }).get()` with no deadline; condition_variable::wait has timeout overloads. If a future change stops stream_close() from reaching the wrapped data_sink::close(), the test hangs to the harness timeout instead of reporting a failure.","introducedByPr":true,"scope":"in-scope","scopeReason":"The wait is added by this PR.","reportedBy":["ce-code-review"],"reportedAs":{"ce-code-review":"st.close_entered_cv.wait(...) at :2011 has no timeout, so a regression preventing stream_close() from being entered hangs the test rather than failing it cleanly."},"targetId":"ironweave"},{"id":"I19","title":"Test cannot distinguish a refusal caused by _stream_closing from one caused by _error","file":"tests/unit/rpc_test.cc","line":2013,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"connection::send() returns make_exception_future\u003c>(closed_error()) for both `_error` and `_stream_closing` (src/rpc/rpc.cc:293, :341). The comment at rpc_test.cc:2013-2015 asserts '_error is not yet set' but nothing checks it, so a future change that made the test pass because _error got set early would go unnoticed.","introducedByPr":true,"scope":"in-scope","scopeReason":"The test and the claim it makes are added by this PR.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"send() returns closed_error for both _stream_closing and _error, and the test comment claims _error is not yet set but nothing checks it; the ordering that makes the test pass for the right reason is a race the fix could lose without failing the test."},"targetId":"ironweave"},{"id":"I20","title":"server_factory is wired up but never read; the server side of the fix is untested","file":"tests/unit/rpc_test.cc","line":1966,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"server_factory.hooks is populated by negotiate() but never read anywhere in the test; only client_factory.hooks is consulted (rpc_test.cc:2000-2001). The fix sits in connection::stream_close(), shared by server::connection, whose teardown additionally runs abort_all_streams()/deregister_this_stream() (src/rpc/rpc.cc:1290-1294), so 'same base function' is not full coverage.","introducedByPr":true,"scope":"in-scope","scopeReason":"The test is added by this PR and already builds the server-side scaffolding.","reportedBy":["anthropic-pr-review","mattpocock-review"],"reportedAs":{"anthropic-pr-review":"server_factory is wired up and never read; the symmetric server-side case is untested, and server teardown (including abort_all_streams()) differs enough from the client's that \"same base function\" isn't a complete argument for coverage.","mattpocock-review":"Spec says the same code serves server::connection so the server side is exposed too, but the test only drives the client; server_factory's hooks are never read, existing only to make negotiation succeed."},"targetId":"ironweave"},{"id":"I21","title":"server_done initialised to make_ready_future\u003c>() makes its check vacuous","file":"tests/unit/rpc_test.cc","line":1978,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"tests/unit/rpc_test.cc:1978 declares `future\u003c> server_done = make_ready_future\u003c>();` and only the handler body overwrites it, so server_done.get() at :2028 succeeds silently if the handler never ran. A std::optional\u003cfuture\u003c>> or an explicit 'handler ran' flag would catch that.","introducedByPr":true,"scope":"in-scope","scopeReason":"The test is added by this PR.","reportedBy":["anthropic-pr-review"],"reportedAs":{"anthropic-pr-review":"future\u003c> server_done = make_ready_future\u003c>() means server_done.get() at line 2028 passes silently even if the server handler never ran."},"targetId":"ironweave"},{"id":"I22","title":"test_sink_state is declared inside the lambda body but outlived by the rpc connection","file":"tests/unit/rpc_test.cc","line":1977,"kind":"bug","severity":"low","verdict":"real","verdictReason":"`test_sink_state st;` is declared inside the do_with_thread body at rpc_test.cc:1977, while the wrappers holding `test_sink_state&` (test_socket_impl, test_connected_socket_impl, test_data_sink_impl) are owned by the rpc stream connection, which deferred_stop(cl) in rpc_test_env::do_with_thread (rpc_test.cc:268) tears down only after the body returns. Nothing touches _st on that path today, so this is latent, but server_factory/client_factory are already declared outside for exactly this reason and st should follow.","introducedByPr":true,"scope":"in-scope","scopeReason":"The declaration is added by this PR.","reportedBy":["anthropic-pr-review","ce-code-review"],"reportedAs":{"anthropic-pr-review":"test_sink_state st is declared inside the lambda body, but wrappers holding test_sink_state& are owned by the rpc connection, which deferred_stop(cl) tears down after the body returns; latent since nothing touches _st on that path today.","ce-code-review":"st is captured by reference by objects whose lifetime follows RPC-internal shared_ptr refcounting rather than C++ scope; declaring st first is protective only if dropping sink and source synchronously releases the last reference."},"targetId":"ironweave"},{"id":"I23","title":"Hardcoded hooks.size()==2u plus hooks.back() pins the fixture's connection count and order","file":"tests/unit/rpc_test.cc","line":2000,"kind":"test-gap","severity":"low","verdict":"real","verdictReason":"rpc_test.cc:2000-2001 asserts client_factory.hooks.size()==2u and then binds `auto&` to hooks.back(). Both client connections are created on shard 0 in a fixed order, so this is deterministic today and the reference cannot be invalidated between :2001 and its use at :2017 (no further client negotiation happens in between) — but a change to rpc_test_env setup would silently retarget the test, and recording the size before make_stream_sink and copying the std::function costs nothing.","introducedByPr":true,"scope":"in-scope","scopeReason":"Both lines are added by this PR.","reportedBy":["anthropic-pr-review","superpowers-review","tob-diff-review"],"reportedAs":{"anthropic-pr-review":"BOOST_REQUIRE_EQUAL(hooks.size(), 2u) hardcodes the fixture's connection count rather than testing th
